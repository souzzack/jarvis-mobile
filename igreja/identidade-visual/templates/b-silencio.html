<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--papel:#EFE9DF;--tinta:#1F1D1A;--terracota:#B4532A;--pedra:#9A9187}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:var(--papel)}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;
 background:radial-gradient(ellipse 80% 60% at 30% 25%,#F5F0E7,transparent 70%),radial-gradient(ellipse 70% 50% at 80% 90%,#E4DCCF,transparent 70%),var(--papel)}
.grao{position:absolute;inset:0;background:url(_grain.svg);opacity:.22;mix-blend-mode:multiply}
.grade{position:absolute;inset:96px;border-top:1.5px solid var(--tinta);border-bottom:1.5px solid var(--tinta)}
.topo{position:absolute;top:120px;left:96px;right:96px;display:flex;justify-content:space-between;
 font:500 19px/1 Inter;letter-spacing:.3em;text-transform:uppercase;color:var(--tinta)}
.topo b{color:var(--terracota);font-weight:600}
.frase{position:absolute;left:96px;right:96px;top:420px;font:400 104px/1.0 Fraunces,serif;
 font-variation-settings:"opsz" 144;letter-spacing:-.03em;color:var(--tinta)}
.frase i{color:var(--terracota);font-style:italic}
.ponto{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--terracota);margin-left:6px;vertical-align:.08em}
.pe{position:absolute;left:96px;right:96px;bottom:126px;display:flex;justify-content:space-between;align-items:flex-end;
 font:400 21px/1.45 Inter;color:#4A4640}
.pe .nota{max-width:520px}
.pe .nota b{display:block;font-weight:600;letter-spacing:.24em;font-size:16px;text-transform:uppercase;color:var(--tinta);margin-bottom:10px}
.pe .marca{font:600 18px/1 Inter;letter-spacing:.3em;color:var(--tinta)}
</style></head><body><div class="post"><div class="grao"></div><div class="grade"></div>
<div class="topo"><span><b>●</b>&nbsp; Frase</span><span>Série Fé no Meio</span></div>
<div class="frase">A fé não acalma toda tempestade. Mas lembra <i>quem está no barco</i><span class="ponto"></span></div>
<div class="pe"><div class="nota"><b>Inspirada em</b>Marcos 4:35-41 — Jesus no barco durante a tempestade.</div><div class="marca">SUA IGREJA</div></div>
</div></body></html>
