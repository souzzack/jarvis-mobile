<body><script type="module">
// Prévia RECONSTRUÍDA a partir do código Luau (tamanhos, cores e posições exatos dos visuais provisórios).

function mat(cor, tipo) {

// boneco R15 aproximado (altura ~5): o personagem do jogador
function personagem(x, z, rotY = 0, cor = '#c8c8c8') {

// ---------------- inimigos (EnemySystem.criarModelo: Bola de vidro com a cor; Boneco = cilindro de madeira)
function inimigo(cfg, x, z, rot = true) {

const INI = {
  Boneco: { nome: 'Boneco de Treino', categoria: 'Teste', raio: 1.5, altura: 5, cor: '#B48A5A' },
  Faisca: { nome: 'Faísca Errante', raio: 1.4, altura: 3, cor: '#56D6FF' },
  Rainha: { nome: 'Rainha-Bobina', raio: 3.5, altura: 7, cor: '#B88CFF' },
  Pilar: { nome: 'Pilar de Cristal', raio: 1.5, altura: 6, cor: '#7FE7FF' },
  Alfa: { nome: 'Cão-Trovão Alfa', raio: 2.6, altura: 5, cor: '#3E5BFF' },
  Matilha: { nome: 'Cão da Matilha', raio: 1.5, altura: 2.6, cor: '#6F86FF' },

// ---------------- criaturas (CompanionSystem.construir: corpo + cabeça + 2 olhos neon)
const ESP = {
  AxoloteNebular: { nome: 'Axolote Nebular', corpo: [1.6, 1.1, 2.6], cor: '#C8A8FF', esc: { Filhote: .55, Juvenil: .8, Adulto: 1 }, alt: 1.5 },
  LebreDeFaisca: { nome: 'Lebre-de-Faísca', corpo: [1.3, 1.5, 2.0], cor: '#FFD36B', esc: { Filhote: .5, Juvenil: .8, Adulto: 1 }, alt: 0 },
  CaoTrovao: { nome: 'Cão-Trovão', corpo: [2.6, 3.0, 5.0], cor: '#5E7CFF', esc: { Filhote: .4, Juvenil: .7, Adulto: 1 }, alt: 0 },
  RaiaDasNuvens: { nome: 'Raia-das-Nuvens', corpo: [8.0, 0.8, 5.0], cor: '#7FD8FF', esc: { Filhote: .35, Juvenil: .65, Adulto: 1 }, alt: 4 },

function criatura(id, estagio, x, z, rot = true, y0 = null) {
  const e = ESP[id], s = e.esc[estagio]; const t = [e.corpo[0] * s, e.corpo[1] * s, e.corpo[2] * s];
  const y = (y0 ?? (e.alt + t[1] / 2));

  caixa(t, [x, y, z], cor, 'SmoothPlastic');
  const k = Math.min(t[0], t[1]) * 0.8; const cab = cor.clone().lerp(new THREE.Color('#fff'), 0.2);
  const cz = z - t[2] / 2 - k * 0.35; caixa([k, k, k], [x, y + t[1] * 0.3, cz], cab);
  for (const l of [-1, 1]) bola(k * 0.22, [x + l * k * 0.25, y + t[1] * 0.3 + k * 0.1, cz - k / 2], '#ffffff', 'Neon');

// ---------------- artefatos (TransformacaoDeArtefato.VISUAL)
const ART = {
  Espada: { t: [0.35, 0.2, 4.2], cor: '#9FE8FF', onde: 'Mao' }, Prancha: { t: [2.4, 0.3, 6.2], cor: '#5FD0FF', onde: 'Pes' },
  Escudo: { t: [2.6, 2.6, 0.3], cor: '#6FBF5A', onde: 'Braco' }, Plataforma: { t: [5, 0.35, 5], cor: '#8EE07A', onde: 'Pes' },
  Cajado: { t: [0.3, 0.3, 5.5], cor: '#CFF7F0', onde: 'Mao' }, Vassoura: { t: [0.4, 0.4, 6], cor: '#CFF7F0', onde: 'Pes' },
  Arco: { t: [0.25, 4, 0.25], cor: '#FFE9A8', onde: 'Mao' }, Asas: { t: [7, 2.2, 0.2], cor: '#FFF6D8', onde: 'Costas' },
};
function comArtefato(forma, x, z) {
  const a = ART[forma]; const voa = a.onde === 'Pes';
  const g = personagem(x, z, 0); if (voa) g.position.y = 3.6;
  const base = g.position.y; let pos;
  if (a.onde === 'Mao') pos = [x + 1.45, base + 1.7, z - 1.8];
  else if (a.onde === 'Braco') pos = [x - 1.85, base + 3, z];
  else if (a.onde === 'Costas') pos = [x, base + 3.8, z + 0.9];
  else pos = [x, base - 0.2, z];
  const m = caixa(a.t, pos, a.cor, 'Neon', 0.85);
  rotulo(forma, [x, base + 7.2, z], 0.7, '#ffe9a8');
}
// ---------------- CENA COMPLETA (arena de teste e arredores)
function montarTudo() {
  inimigo(INI.Boneco, C.x, C.z); inimigo(INI.Faisca, C.x + 18, C.z + 14); inimigo(INI.Faisca, C.x - 18, C.z + 16);
  // Rainha + 3 pilares (fase de carga) e Alfa + matilha
  inimigo(INI.Rainha, C.x, C.z - 90);
  for (let i = 1; i <= 3; i++) { const a = i / 3 * Math.PI * 2; inimigo(INI.Pilar, C.x + Math.cos(a) * 14, C.z - 90 + Math.sin(a) * 14, i === 1); }
  inimigo(INI.Alfa, C.x - 90, C.z - 60); inimigo(INI.Matilha, C.x - 80, C.z - 52); inimigo(INI.Matilha, C.x - 98, C.z - 50, false);
  // estações, estruturas, livros
  caixa([5, 3, 3], [C.x + 30, 1.5, C.z - 10], '#8A6A4A'); rotulo('Bancada (Oficina)', [C.x + 30, 5, C.z - 10], 0.7);
  [['OficinaDosInventores', 30], ['Observatorio', 38], ['TorreMeteorologica', 46]].forEach(([n, dx]) => { caixa([2, 5, 2], [C.x + dx, 2.5, C.z - 4], '#5B6B7A'); });
  rotulo('Marcadores de restauração', [C.x + 38, 7, C.z - 4], 0.7);
  ['Grimório', 'Tomo', 'Códice'].forEach((n, i) => { const x = C.x - 12 + i * 8, z = C.z - 22; caixa([2, 3, 2], [x, 1.5, z], '#6B5A45'); caixa([1.6, .35, 1.2], [x, 3.2, z], '#E8D7A8', 'Neon'); rotulo(n, [x, 5, z], 0.6); });
  // pontos de viagem (discos)
  [[0, 12, 'Arena'], [36, 8, 'Oficina'], [0, -60, 'Câmara da Rainha'], [-60, -30, 'Floresta do Alfa']].forEach(([dx, dz, n]) => {
    const d = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.4, 32), mat('#9FE8FF', 'Neon')); d.material.transparent = true; d.material.opacity = 0.7;
    d.position.set(C.x + dx, 0.6, C.z + dz); cena.add(d); rotulo('Viagem: ' + n, [C.x + dx, 3, C.z + dz], 0.6, '#9FE8FF');
  });
  // base pessoal (parcelas + espaços com nível)
  [[-70, 40], [-70, 90]].forEach(([dx, dz], i) => caixa([36, 1, 36], [C.x + dx, 0.05, C.z + dz], '#6E7F5A'));
  const pc = [C.x - 70, 0.55, C.z + 40];
  [['Forja', -10, 0, '#B4553A', 3], ['Jardim', 10, 0, '#5DBB63', 2], ['Expositor', 0, -10, '#C9B26B', 1]].forEach(([n, dx, dz, cor, nv]) => {
    const h = 2 + nv * 0.6; caixa([4 + nv, h, 4 + nv], [pc[0] + dx, pc[1] + h / 2, pc[2] + dz], cor);
    caixa([2, 2.5, 0.3], [pc[0] + dx, pc[1] + 1.25, pc[2] + dz + (4 + nv) / 2 + 1.5], '#4A3B2C');
    rotulo(`${n} nv ${nv}`, [pc[0] + dx, pc[1] + h + 2, pc[2] + dz], 0.6);
  });
  caixa([1, 1.6, 1], [pc[0] - 1.5 + 0, pc[1] + 2.6 + 0.8, pc[2] - 10], '#B88CFF', 'Neon'); caixa([1, 1.6, 1], [pc[0], pc[1] + 2.6 + 0.8, pc[2] - 10], '#3E5BFF', 'Neon');
  rotulo('Base de Jogador', [pc[0], 9, pc[2]], 1);
  // escondidos revelados (trilha) e corrente ascendente
  caixa([4, 1, 18], [C.x - 30, C.y + 2, C.z + 40], '#C9B26B', 'Neon', 0.9); rotulo('Trilha escondida (revelada)', [C.x - 30, C.y + 5, C.z + 40], 0.6);
  caixa([14, 60, 14], [C.x + 30, C.y + 20, C.z + 60], '#bfe9ff', 'Neon', 0.18); rotulo('Corrente ascendente', [C.x + 30, 52, C.z + 60], 0.7);
  // jogador + criatura ao lado
  personagem(C.x + 4, C.z + 22, Math.PI); criatura('CaoTrovao', 'Adulto', C.x + 9, C.z + 24, false);

let cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 2000);
if (vista === 'geral') {
  montarTudo(); cam.position.set(C.x + 75, 70, C.z + 85); cam.lookAt(C.x - 25, 0, C.z - 25);
} else if (vista === 'arena') {
  montarTudo(); cam.position.set(C.x + 22, 22, C.z + 52); cam.lookAt(C.x + 4, 2, C.z + 2);
} else if (vista === 'criaturas') {

  Object.keys(ESP).forEach((id, i) => est.forEach((e, j) => criatura(id, e, -18 + j * 18, -i * 14 + 20)));
  personagem(-30, 20, Math.PI); rotulo('Jogador (escala)', [-30, 7.5, 20], 0.6);
  cam.position.set(-4, 30, -62); cam.lookAt(0, 0, 0);
} else if (vista === 'artefatos') {
  cena.fog = null; ['Espada', 'Prancha', 'Escudo', 'Plataforma', 'Cajado', 'Vassoura', 'Arco', 'Asas'].forEach((f, i) => comArtefato(f, -35 + i * 10, 0));
  cam.position.set(0, 11, -50); cam.lookAt(0, 3, 0);
} else if (vista === 'chefes') {

  inimigo(INI.Alfa, 24, 0); inimigo(INI.Matilha, 31, 6); inimigo(INI.Matilha, 17, 7, false);
  personagem(4, 14); rotulo('Jogador (escala)', [4, 7.5, 14], 0.6);
  cam.position.set(4, 24, -46); cam.lookAt(4, 2, 0);

r.render(cena, cam); window.__pronto = true;
