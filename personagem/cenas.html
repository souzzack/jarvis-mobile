<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0706; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createStudio, keyPos, W, H } from './estudio.js';
import { createMascot, pose } from './mascote.js';
import { telaTimeline, telaMotion, telaAntesDepois, telaFinal } from './telas.js';

// Cenas 02 a 05. Uso: cenas.html?n=2
const n = Number(new URLSearchParams(location.search).get('n'));

const CENAS = {
  2: { // Organizando a timeline
    screen: telaTimeline, key: [3, 5], dx: 0, rotY: 0.3, pose: 'apontar', headY: 0.15,
    cam: [1.6, 4.4, 17], look: [0.9, 4.1, -3],
  },
  3: { // Criando animações
    screen: telaMotion, key: [0, 3], dx: 0, rotY: 0.3, pose: 'apontar', headY: 0.2,
    cam: [0.6, 3.6, 14.5], look: [-0.2, 4.4, -5],
  },
  4: { // Antes e depois
    screen: telaAntesDepois, key: [2, 5], dx: 0, rotY: 0.1, pose: 'apontar', headY: 0.25,
    cam: [1.6, 4.4, 19.5], look: [0.8, 4.2, -3],
  },
  5: { // Encerramento
    screen: telaFinal, key: [2, 5], dx: 0.58, rotY: 0, pose: 'sentado', headY: 0,
    cam: [0.3, 3.4, 15], look: [0.3, 4.4, -2], screenIntensity: 0.55, finale: true,
  },
};
const C = CENAS[n];

const studio = createStudio({ drawScreen: C.screen, screenIntensity: C.screenIntensity ?? 0.95, showMug: !C.finale });
const { scene } = studio;

const m = createMascot();
if (C.pose) pose(m, C.pose);
const p = keyPos(...C.key);
m.root.position.set(p.x + C.dx, p.y, p.z);
m.root.rotation.y = C.rotY;
m.head.rotation.y = C.headY;
m.head.rotation.z = 0.06;
scene.add(m.root);

if (C.finale) {
  // contraluz laranja intensa atrás do personagem
  const back = new THREE.SpotLight(0xff7a2a, 160, 20, 0.5, 0.7, 1.5);
  back.position.set(m.root.position.x, 6.5, m.root.position.z - 4.5);
  back.target = m.root; scene.add(back);
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,140,60,0.9)'); gr.addColorStop(0.4, 'rgba(255,100,30,0.35)'); gr.addColorStop(1, 'rgba(255,80,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.position.set(m.root.position.x, 2.6, m.root.position.z - 1.6);
  scene.add(halo);
  studio.key.intensity = 25;
  studio.fill.intensity = 18;
}

const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
camera.position.set(...C.cam);
camera.lookAt(...C.look);
studio.render(camera, m.root.position.clone().add(new THREE.Vector3(0, 1.6, 0)), { aperture: 0.0012, maxblur: 0.008 });
</script>
</body>
</html>
