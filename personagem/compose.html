<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Pós-produção: gancho, zooms, tremidas, flashes, transições e legenda dinâmica
// sobre os quadros 3D já renderizados. window.draw(T) desenha o instante T (s).
const W = 1080, H = 1920, FPS = 24;
const ctx = document.getElementById('c').getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const outCubic = (x) => 1 - Math.pow(1 - clamp(x), 3);
const outBack = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- quadros de origem
const cache = new Map();
function frameImg(shot, t) {
  const idx = Math.max(0, Math.min(143, Math.round(t * FPS)));
  const key = shot + ':' + idx;
  if (!cache.has(key)) {
    const im = new Image();
    im.src = `video/frames/frames${shot}/${String(idx).padStart(4, '0')}.jpg`;
    cache.set(key, im.decode().then(() => im));
    if (cache.size > 40) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
}

const HOOK_END = 0.9;
const TEASER = [{ shot: 3, t: 4.6 }, { shot: 4, t: 5.25 }, { shot: 2, t: 4.2 }, { shot: 5, t: 3.7 }];
const CUTS = [HOOK_END, 6, 12, 18, 24];
function source(T) {
  if (T < HOOK_END) { const i = Math.min(3, Math.floor(T / 0.225)); return { ...TEASER[i], teaser: (T - i * 0.225) / 0.225 }; }
  const shot = Math.min(5, Math.floor(T / 6) + 1);
  let t = T - 6 * (shot - 1);
  if (shot === 1) t = 1.0 + (T - HOOK_END) * (5.0 / 5.1);   // pula o começo parado da cena 1
  return { shot, t };
}

// ---------- câmera virtual: zooms (punch-ins), tremidas e flashes
const PUNCH = [
  { T: 0.9, s: 1.0, ax: 0.5, ay: 0.45 },
  { T: 3.42, s: 1.2, ax: 0.62, ay: 0.62, d: 0.08 },
  { T: 4.7, s: 1.04, ax: 0.5, ay: 0.5, d: 0.5 },
  { T: 6, s: 1.0, ax: 0.5, ay: 0.5, d: 0 },
  { T: 8.95, s: 1.22, ax: 0.4, ay: 0.45, d: 0.1 },
  { T: 10.9, s: 1.06, ax: 0.45, ay: 0.4, d: 0.6 },
  { T: 12, s: 1.0, ax: 0.5, ay: 0.5, d: 0 },
  { T: 13.55, s: 1.26, ax: 0.52, ay: 0.3, d: 0.1 },
  { T: 15.55, s: 1.14, ax: 0.3, ay: 0.62, d: 0.12 },
  { T: 18, s: 1.0, ax: 0.5, ay: 0.5, d: 0 },
  { T: 19.75, s: 1.2, ax: 0.28, ay: 0.33, d: 0.1 },
  { T: 20.7, s: 1.2, ax: 0.75, ay: 0.33, d: 0.28 },
  { T: 21.6, s: 1.34, ax: 0.73, ay: 0.4, d: 0.1 },
  { T: 22.85, s: 1.03, ax: 0.45, ay: 0.62, d: 0.25 },
  { T: 24, s: 1.18, ax: 0.5, ay: 0.58, d: 0 },
  { T: 24.01, s: 1.0, ax: 0.5, ay: 0.5, d: 1.6 },
];
const SHAKES = [{ T: 0.9, a: 16, d: 0.28 }, { T: 3.42, a: 20, d: 0.32 }, { T: 8.95, a: 6, d: 0.15 }, { T: 13.55, a: 6, d: 0.15 }, { T: 21.6, a: 7, d: 0.15 }, { T: 23.1, a: 9, d: 0.22 }];
const FLASHES = [{ T: 0.9, a: 0.75 }, { T: 3.42, a: 0.4 }, { T: 6, a: 0.28 }, { T: 12, a: 0.28 }, { T: 18, a: 0.28 }, { T: 24, a: 0.35 }, { T: 0.225, a: 0.25 }, { T: 0.45, a: 0.25 }, { T: 0.675, a: 0.25 }];

function camera(T) {
  let cur = { s: 1.08, ax: 0.5, ay: 0.5 };
  if (T >= HOOK_END) {
    let prev = { s: 1, ax: 0.5, ay: 0.5 };
    for (const p of PUNCH) {
      if (T < p.T) break;
      const k = p.d ? outCubic((T - p.T) / p.d) : 1;
      cur = { s: lerp(prev.s, p.s, k), ax: lerp(prev.ax, p.ax, k), ay: lerp(prev.ay, p.ay, k) };
      prev = cur;
    }
    // deriva lenta contínua: a imagem nunca fica parada
    const local = T - Math.max(...CUTS.filter(c => c <= T));
    cur.s *= 1 + 0.012 * local;
  }
  let dx = 0, dy = 0;
  for (const s of SHAKES) {
    const u = (T - s.T) / s.d;
    if (u >= 0 && u < 1) { const a = s.a * (1 - u); dx += Math.sin(T * 97) * a; dy += Math.cos(T * 83) * a; }
  }
  let flash = 0;
  for (const f of FLASHES) { const u = (T - f.T) / 0.16; if (u >= 0 && u < 1) flash = Math.max(flash, f.a * (1 - u)); }
  // transições em zoom com desfoque radial
  let zoom = 1, blur = 0;
  for (const c of CUTS) {
    if (T >= c - 0.12 && T < c) { const u = (T - (c - 0.12)) / 0.12; zoom = 1 + 0.4 * u * u; blur = u; }
    if (T >= c && T < c + 0.2) { const u = outCubic((T - c) / 0.2); zoom = lerp(1.35, 1, u); blur = 1 - u; }
  }
  const src = source(T);
  if (src.teaser !== undefined) { zoom *= lerp(1.18, 1.0, outCubic(src.teaser)); blur = Math.max(blur, 1 - outCubic(src.teaser * 2.5)); }
  return { ...cur, s: cur.s * zoom, dx, dy, flash, blur };
}

// ---------- legenda: tempos das palavras a partir dos trechos de fala da narração
const SPANS = [
  [0.40, 5.06, 'Você sabia que o Claude pode ajudar a transformar vídeos brutos em edições profissionais?'],
  [6.25, 6.65, 'Primeiro,'],
  [6.81, 10.06, 'ele ajuda a planejar os cortes e organizar a sequência do vídeo.'],
  [12.24, 16.42, 'Também pode ajudar a criar legendas, animações, títulos e efeitos.'],
  [18.15, 20.93, 'Com as ferramentas certas,'],
  [21.04, 22.72, 'o projeto pode ser montado, renderizado e revisado.'],
  [23.10, 25.60, 'A inteligência artificial acelera o processo.'],
  [25.81, 26.14, 'Mas é'],
  [26.23, 28.88, 'a criatividade que transforma uma edição em algo'],
  [28.98, 29.99, 'inesquecível!'],
];
const KEY = new Set(['claude', 'brutos', 'profissionais', 'cortes', 'sequência', 'legendas', 'animações', 'títulos', 'efeitos', 'ferramentas', 'certas', 'montado', 'renderizado', 'revisado', 'inteligência', 'artificial', 'acelera', 'criatividade', 'inesquecível']);
const syl = (w) => Math.max(1, (w.toLowerCase().match(/[aeiouáéíóúâêôãõà]+/g) || []).length);
const WORDS = [];
for (const [a, b, text] of SPANS) {
  const ws = text.split(' ');
  const weights = ws.map(w => syl(w) + (/[,.?!]$/.test(w) ? 0.6 : 0));
  const total = weights.reduce((x, y) => x + y, 0);
  let t = a;
  ws.forEach((w, i) => { const d = (b - a) * weights[i] / total; WORDS.push({ w, s: t, e: t + d, key: KEY.has(w.toLowerCase().replace(/[^a-zà-ú]/g, '')) }); t += d; });
}
// blocos de até 3 palavras, quebrando na pontuação
const CHUNKS = [];
let cur = [];
WORDS.forEach((w, i) => {
  cur.push(w);
  const next = WORDS[i + 1];
  const brk = /[,.?!]$/.test(w.w) || cur.length >= 3 || !next || next.s - w.e > 0.3 || (cur.length >= 2 && next && next.w.length > 9);
  if (brk) { CHUNKS.push(cur); cur = []; }
});
CHUNKS.forEach((c, i) => { c.start = c[0].s - 0.04; const nx = CHUNKS[i + 1]; c.end = nx ? Math.min(nx[0].s - 0.04, c[c.length - 1].e + 0.45) : c[c.length - 1].e + 0.5; });

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawCaption(T) {
  const c = CHUNKS.find(c => T >= c.start && T < c.end);
  if (!c) return;
  const FS = 84, GAP = 38, LH = 108, MAXW = 960;
  ctx.font = `900 ${FS}px Montserrat, DejaVu Sans, sans-serif`;
  const items = c.map(w => ({ ...w, up: w.w.toUpperCase(), wd: ctx.measureText(w.w.toUpperCase()).width }));
  const lines = [[]]; let lw = 0;
  for (const it of items) {
    if (lines.at(-1).length && lw + GAP + it.wd > MAXW) { lines.push([]); lw = 0; }
    lines.at(-1).push(it); lw += (lw ? GAP : 0) + it.wd;
  }
  const cy = 1390;
  const pop = outBack((T - c.start) / 0.16);
  const fade = clamp((c.end - T) / 0.08);
  ctx.save();
  ctx.translate(W / 2, cy); ctx.scale(lerp(0.55, 1, pop), lerp(0.55, 1, pop)); ctx.translate(-W / 2, -cy);
  ctx.globalAlpha = fade;
  ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  lines.forEach((ln, li) => {
    const total = ln.reduce((s, it) => s + it.wd, 0) + GAP * (ln.length - 1);
    let x = W / 2 - total / 2;
    const y = cy + (li - (lines.length - 1) / 2) * LH;
    for (const it of ln) {
      const active = T >= it.s && T < it.e + 0.02;
      const spoken = T >= it.s;
      const k = active ? outBack((T - it.s) / 0.12) : 0;
      ctx.save();
      ctx.translate(x + it.wd / 2, y); const sc = active ? lerp(1, 1.06, k) : 1; ctx.scale(sc, sc); ctx.rotate(active ? -0.025 * k : 0);
      if (active) {
        ctx.shadowColor = 'rgba(255,110,30,0.55)'; ctx.shadowBlur = 30;
        ctx.fillStyle = '#ff6b1a'; roundRect(-it.wd / 2 - 14, -FS * 0.6, it.wd + 28, FS * 1.2, 18); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff'; ctx.fillText(it.up, -it.wd / 2, 4);
      } else {
        ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
        ctx.strokeStyle = '#140a06'; ctx.lineWidth = 14; ctx.strokeText(it.up, -it.wd / 2, 4);
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = it.key ? '#ffd36b' : '#ffffff';
        ctx.globalAlpha = fade * (spoken ? 1 : 0.92);
        ctx.fillText(it.up, -it.wd / 2, 4);
      }
      ctx.restore();
      x += it.wd + GAP;
    }
  });
  ctx.restore();
}

function stamp(text, T0, T, y, size, color, out) {
  if (T < T0 || (out && T > out + 0.18)) return;
  const k = outBack((T - T0) / 0.18);
  const o = out ? clamp(1 - (T - out) / 0.15) : 1;
  ctx.save();
  ctx.font = `900 ${size}px Montserrat, DejaVu Sans, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.translate(W / 2, y);
  const s = lerp(1.7, 1, k) * (out && T > out ? 1 + (T - out) * 3 : 1);
  ctx.scale(s, s); ctx.rotate(lerp(-0.08, -0.02, k));
  ctx.globalAlpha = clamp((T - T0) / 0.06) * o;
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.strokeStyle = '#140a06'; ctx.lineWidth = 18; ctx.strokeText(text, 0, 0);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

window.draw = async (T) => {
  const src = source(T);
  const im = await frameImg(src.shot, src.t);
  frameImg(src.shot, src.t + 1 / FPS);   // pré-carrega o próximo
  const cam = camera(T);
  ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.filter = 'contrast(1.1) saturate(1.18) brightness(1.03)';
  const drawAt = (s, alpha) => {
    ctx.globalAlpha = alpha;
    const ax = cam.ax * W, ay = cam.ay * H;
    ctx.setTransform(s, 0, 0, s, ax - ax * s + cam.dx, ay - ay * s + cam.dy);
    ctx.drawImage(im, 0, 0, W, H);
  };
  const s0 = Math.max(cam.s, 1.0) * (cam.dx || cam.dy ? 1.03 : 1);
  drawAt(s0, 1);
  if (cam.blur > 0.02) for (let i = 1; i <= 6; i++) drawAt(s0 * (1 + 0.035 * i * cam.blur), 0.45 * cam.blur);
  ctx.restore();
  ctx.filter = 'none';
  vignette();
  if (cam.flash > 0) { ctx.fillStyle = `rgba(255,236,214,${cam.flash})`; ctx.fillRect(0, 0, W, H); }
  // gancho
  stamp('DE VÍDEO BRUTO', 0.03, T, 560, 104, '#ffffff', HOOK_END - 0.05);
  stamp('A EDIÇÃO PRO', 0.42, T, 700, 120, '#ff7a2a', HOOK_END - 0.05);
  // fechamento
  stamp('A IA ACELERA.', 27.15, T, 430, 86, '#ffffff');
  stamp('A CRIATIVIDADE', 27.55, T, 545, 96, '#ff7a2a');
  stamp('TRANSFORMA.', 27.85, T, 660, 96, '#ff7a2a');
  drawCaption(T);
};
document.fonts.load('900 84px Montserrat').then(() => { window.__ready = true; });
</script>
</body>
</html>
