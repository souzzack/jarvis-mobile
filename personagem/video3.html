<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0706; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createStudio, keyPos, W, H } from './estudio.js';
import { createMascot } from './mascote.js';
import { telaTimeline, telaRender, telaPedido, telaFinal } from './telas.js';

// Vídeo descontraído: "Coisas que ninguém te conta sobre ser uma IA".
// Planos: H1 R1 M1 C1 C2 B1 S1 W1. Uso: video3.html?shot=R1; window.frame(u) com u em segundos dentro do plano.
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => smooth((t - a) / (b - a));
const mix = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const STAND = { armR: 0, armL: -0.25, rp: [1.42, 1.06, 0.36], rr: [0, 0, -0.06], ry: -0.01 };
const HERO = { armR: 1.35, armL: -0.25, rp: [1.2, 1.75, 0.3], rr: [0, 0, 0.12], ry: 0.65 };
const STAR = { armR: 1.1, armL: -0.25, rp: [1.1, 1.85, 0.3], rr: [0, 0, 0.55], ry: 0.5 };
const SHOULDER = { armR: 1.0, armL: -0.25, rp: [1.22, 1.41, 0.3], rr: [-0.45, 0, -0.4], ry: 0.85 };
function pose(m, A, B, k) {
  m.armR.rotation.z = mix(A.armR, B.armR, k);
  m.armL.rotation.z = mix(A.armL, B.armL, k);
  m.rulerPivot.position.set(...A.rp.map((v, i) => mix(v, B.rp[i], k)));
  m.rulerPivot.rotation.set(...A.rr.map((v, i) => mix(v, B.rr[i], k)));
  m.ruler.position.y = mix(A.ry, B.ry, k);
}
function eyes(m, open) { m.eyes.forEach(({ eye, s1, s2 }) => { eye.scale.y = Math.max(0.08, open); s1.visible = s2.visible = open > 0.45; }); }
const blink = (t, at) => 1 - Math.max(0, 1 - Math.abs(t - at) / 0.07);
function star(m, v) { m.star.material.emissiveIntensity = 5 * v; m.starLight.intensity = 6 * v; }
function sit(m, s) {
  const drop = (m.legH - 0.19) * s;
  m.body.position.y = -drop;
  m.legs.forEach(l => { l.rotation.x = -Math.PI / 2 * s; l.position.y = m.legH - drop; l.visible = l.position.z > 0 || s < 0.6; });
}

const SCREENS = {
  H1: { draw: (g, w, h) => telaTimeline(g, w, h), intensity: 0.35 },
  R1: { draw: (g, w, h) => telaTimeline(g, w, h), intensity: 0.6, pressedKey: [3, 9] },
  M1: { draw: (g, w, h) => telaTimeline(g, w, h) },
  C1: { draw: (g, w, h) => telaRender(g, w, h, { n: 1 }) },
  C2: { draw: (g, w, h) => telaRender(g, w, h, { n: 3 }) },
  B1: { draw: (g, w, h) => telaPedido(g, w, h, { typing: 0 }) },
  S1: { draw: telaFinal, intensity: 0.5, finale: true },
  W1: { draw: telaFinal, intensity: 0.5, finale: true },
};
const S = SCREENS[SHOT];
const studio = createStudio({ drawScreen: S.draw, screenIntensity: S.intensity ?? 0.95, pressedKey: S.pressedKey ?? null, showMug: !S.finale, screenScale: 1, shadowSize: 1024 });
const { scene } = studio;
const m = createMascot();
scene.add(m.root);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
const head = () => m.root.position.clone().add(V(0, 1.95 + m.body.position.y, 0));
const screenNormal = V(0, Math.sin(0.22), Math.cos(0.22));

function finaleLights(soft = 1) {
  const back = new THREE.SpotLight(0xff7a2a, 150 * soft, 20, 0.5, 0.7, 1.5);
  back.position.set(m.root.position.x, 6.5, m.root.position.z - 4.5); back.target = m.root; scene.add(back);
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,140,60,0.9)'); gr.addColorStop(0.4, 'rgba(255,100,30,0.35)'); gr.addColorStop(1, 'rgba(255,80,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: soft }));
  halo.position.set(m.root.position.x, 2.6, m.root.position.z - 1.6); scene.add(halo);
  studio.key.intensity = 25; studio.fill.intensity = 18;
}

let update;
switch (SHOT) {
  case 'H1': { // close dramático, sério demais; a estrela falha no fim
    const p = keyPos(2, 5); m.root.position.copy(p);
    update = (u) => {
      pose(m, STAND, STAND, 0);
      eyes(m, 0.58 * blink(u, 1.2) + 0.0);
      const flick = (u > 2.5 && u < 2.58) || (u > 2.68 && u < 2.74) ? 0.15 : 0.75;
      star(m, flick);
      m.head.rotation.x = -0.04;
      const k = smooth(u / 3.0);
      camera.position.set(p.x + 0.2, 2.55, mix(p.z + 9.5, p.z + 5.2, k));
      camera.lookAt(p.x, 2.62, p.z);
      return head();
    };
    break;
  }
  case 'R1': { // pose de herói com a régua... que escorrega e cai na tecla
    const P = studio.pressed, kp = P.pos;
    m.root.position.set(kp.x - 2.3, kp.y, kp.z - 0.4);
    const r = m.root.position;
    const LYING_POS = [2.3, 0.12, 0.4], LYING_ROT = [0, 0, -Math.PI / 2];
    update = (u) => {
      star(m, 1); m.head.rotation.set(0, 0, 0);
      const hero = seg(u, 0.4, 1.3);
      pose(m, STAND, HERO, hero);
      m.body.rotation.x = -0.06 * hero; m.head.rotation.x = -0.12 * hero;
      // queda: 3,9 → 4,35 s
      const f = clamp((u - 3.9) / 0.45), g = f * f;
      if (u >= 3.9) {
        const from = { rp: HERO.rp, rr: HERO.rr };
        m.rulerPivot.position.set(mix(from.rp[0], LYING_POS[0], f), mix(from.rp[1], LYING_POS[1], g), mix(from.rp[2], LYING_POS[2], f));
        const wob = u > 4.35 ? Math.sin((u - 4.35) * 30) * 0.08 * Math.max(0, 1 - (u - 4.35) / 0.4) : 0;
        m.rulerPivot.rotation.set(0, 0, mix(from.rr[2], LYING_ROT[2], g) + wob);
        m.ruler.position.y = mix(HERO.ry, 0, f);
        m.armR.rotation.z = mix(HERO.armR, 0.1, seg(u, 4.2, 4.8));
      }
      const hit = seg(u, 4.33, 4.38), glow = hit * (1 - 0.5 * seg(u, 4.6, 5.6));
      P.key.position.y = mix(0.58, 0.5, hit * (1 - 0.6 * seg(u, 4.5, 4.8)));
      P.legend.position.y = P.key.position.y + 0.121;
      P.mat.emissiveIntensity = 1.4 * glow; P.light.intensity = 9 * glow;
      // olhar: régua no chão → câmera, com cara de paisagem
      if (u > 4.4) {
        m.head.rotation.y = mix(0, 0.45, seg(u, 4.45, 4.75)) * (1 - seg(u, 5.15, 5.35));
        m.head.rotation.x = 0.22 * seg(u, 4.45, 4.75) * (1 - seg(u, 5.15, 5.35));
        m.body.rotation.x = 0;
      }
      eyes(m, u > 5.3 ? 0.5 * blink(u, 5.75) : 1);
      if (u < 4.4) { // contra-plongée heroica
        camera.position.set(r.x + 1.6, mix(1.1, 1.3, u / 4.4), r.z + mix(8.0, 7.2, u / 4.4));
        camera.lookAt(r.x + 0.6, 2.9, r.z);
        return r.clone().add(V(0.6, 2.2, 0));
      }
      camera.position.set(r.x + 0.9, 2.6, r.z + mix(8.6, 8.0, (u - 4.4) / 1.6));
      camera.lookAt(r.x + 0.75, 2.0, r.z);
      return r.clone().add(V(1.1, 1.4, 0));
    };
    break;
  }
  case 'M1': { // balança a cabeça fora do ritmo; a música para e ele continua
    const p = keyPos(2, 5); m.root.position.copy(p);
    update = (u) => {
      pose(m, STAND, STAND, 0); star(m, 1);
      const bobbing = u < 4.65 ? 1 : 0;
      const b = Math.max(0, Math.sin(2 * Math.PI * (u * 2.0 + 0.37))) * bobbing;
      m.head.rotation.x = 0.24 * b; m.body.position.y = 0.05 * b; m.root.rotation.z = 0.05 * Math.sin(u * 2 * Math.PI) * bobbing;
      eyes(m, u < 4.65 ? 0.55 : 1 * blink(u, 5.5));
      m.head.rotation.y = u > 4.8 ? -0.35 * seg(u, 4.8, 4.95) + 0.7 * seg(u, 5.3, 5.45) : 0;
      camera.position.set(p.x + 0.6, 2.5, mix(p.z + 8.2, p.z + 6.8, smooth(u / 6)));
      camera.lookAt(p.x, 2.2, p.z);
      return head();
    };
    break;
  }
  case 'C1': { // close na tela: 1/900... 2/900... 3/900
    const p = keyPos(0, 6); m.root.position.copy(p); m.root.rotation.y = Math.PI;
    const scr = studio.screenPoint(800, 330);
    update = (u) => {
      pose(m, STAND, STAND, 0); star(m, 1); eyes(m, 1);
      studio.redraw((g, w, h) => telaRender(g, w, h, { n: 1 + Math.min(2, Math.floor(u / 0.75)) }));
      const d = mix(16.5, 15.0, u / 2.4);
      camera.position.copy(scr).addScaledVector(screenNormal, d).add(V(0, -0.8, 0));
      camera.lookAt(scr.clone().add(V(0, -0.5, 0)));
      return scr;
    };
    break;
  }
  case 'C2': { // sentado na beirada, desanimado, tenta alcançar a caneca
    const p = keyPos(3, 11); m.root.position.copy(p);
    const mug = V(10.5, 1.0, 3.5);
    m.root.rotation.y = Math.atan2(mug.x - p.x, mug.z - p.z) - Math.PI / 2;
    update = (u) => {
      sit(m, 1); star(m, 1 - 0.35 * seg(u, 0, 1.6));
      pose(m, STAND, STAND, 0);
      m.body.position.y -= 0.12 * seg(u, 0.2, 1.6);           // desaba
      m.head.rotation.x = 0.25 * seg(u, 0.2, 1.6) * (1 - seg(u, 1.8, 2.1));
      eyes(m, mix(1, 0.5, seg(u, 0.2, 1.6)) * blink(u, 3.2));
      const reach = seg(u, 2.0, 2.5) * (1 - seg(u, 3.25, 3.5));
      m.armR.rotation.z = mix(0, -0.05, reach) + Math.sin(u * 40) * 0.04 * reach;
      m.armR.scale.x = 1 + 0.35 * reach;
      m.rulerPivot.visible = false;
      m.root.rotation.z = -0.12 * reach;
      m.head.rotation.y = 0.7 * seg(u, 1.9, 2.2) * (1 - seg(u, 3.3, 3.5)) - 0.5 * seg(u, 3.3, 3.5);
      const mid = p.clone().lerp(V(mug.x, 0.8, mug.z), 0.45);
      camera.position.set(mid.x, 3.0, mid.z + 14.0);
      camera.lookAt(mid.x, 1.3, mid.z);
      return mid;
    };
    break;
  }
  case 'B1': { // "deixa mais profissional" → mais brilho → estoura
    const p = keyPos(2, 5); m.root.position.copy(p);
    update = (u) => {
      studio.redraw((g, w, h) => telaPedido(g, w, h, { typing: seg(u, 0.1, 1.5) }));
      const point = seg(u, 1.7, 2.2);
      pose(m, STAND, STAR, point * (1 - seg(u, 4.4, 4.9)));
      const k = clamp((u - 2.0) / 1.2);
      const blown = u >= 3.2 && u < 3.6;
      star(m, u < 3.2 ? 1 + 28 * k * k * k : blown ? 30 : 1);
      m.starLight.intensity = u < 3.2 ? 6 + 120 * k * k * k : blown ? 120 : 6;
      eyes(m, u < 1.9 ? 1 : u < 3.6 ? mix(1, 0.45, k) : u < 5.2 ? 0.22 : 1 * blink(u, 5.6));
      m.head.rotation.z = u > 3.6 && u < 5.2 ? Math.sin(u * 30) * 0.03 : 0.04;
      if (u < 3.6) {
        const d = mix(9.0, 6.6, seg(u, 1.9, 3.2));
        camera.position.set(p.x + 0.4, 2.6, p.z + d); camera.lookAt(p.x, 2.7, p.z);
      } else {
        camera.position.set(p.x - 0.9, 2.4, p.z + 5.6); camera.lookAt(p.x, 2.5, p.z);
      }
      return head();
    };
    break;
  }
  case 'S1': { // virada sincera: sentado, régua no ombro, luz suave
    const p = keyPos(2, 5); m.root.position.set(p.x + 0.58, p.y, p.z);
    finaleLights(0.75);
    update = (u) => {
      sit(m, 1); pose(m, SHOULDER, SHOULDER, 1);
      star(m, 0.85 + 0.08 * Math.sin(u * 2)); eyes(m, blink(u, 2.4));
      m.head.rotation.z = 0.08 * smooth(u / 2);
      const k = smooth(u / 6);
      camera.position.set(0.3, mix(3.1, 2.8, k), mix(13.5, 9.5, k));
      camera.lookAt(0.3, mix(3.2, 2.7, k), -2);
      return m.root.position.clone().add(V(0, 1.3, 0));
    };
    break;
  }
  case 'W1': { // acena, perde o equilíbrio, finge que foi de propósito
    const p = keyPos(2, 5); m.root.position.set(p.x + 0.58, p.y, p.z);
    finaleLights(1);
    update = (u) => {
      sit(m, 1); pose(m, SHOULDER, SHOULDER, 1);
      const wave = seg(u, 0.15, 0.4) * (1 - seg(u, 1.15, 1.3));
      const tip = seg(u, 1.3, 1.75) * (1 - seg(u, 1.85, 2.1));
      const over = Math.sin(clamp((u - 2.1) / 0.3) * Math.PI) * 0.06;
      m.armL.rotation.z = mix(-0.25, -1.65 + Math.sin(u * 12) * 0.35, wave) + mix(0, -1.0, tip);
      m.root.rotation.z = 0.42 * tip - over;
      const posePct = seg(u, 2.3, 2.55);
      m.armL.rotation.z += mix(0, -1.7, posePct);
      star(m, 1 + 0.6 * seg(u, 2.35, 2.5) - 0.4 * seg(u, 2.6, 3.2));
      eyes(m, u > 1.3 && u < 2.1 ? 1.15 : blink(u, 3.6));
      m.head.rotation.z = -0.15 * tip;
      camera.position.set(0.3, 3.2, mix(12.4, 13.2, u / 5));
      camera.lookAt(0.3, 3.9, -2);
      return m.root.position.clone().add(V(0, 1.3, 0));
    };
    break;
  }
}

const f0 = update(0);
const { composer, bokeh } = studio.makeComposer(camera, f0, { aperture: 0.0016, maxblur: 0.009, samples: 0 });
window.frame = (u) => { const f = update(u); bokeh.uniforms['focus'].value = camera.position.distanceTo(f); composer.render(); };
window.frame(0);
window.__ready = true;
</script>
</body>
</html>
