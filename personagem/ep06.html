  const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6a5a3a, 1.0); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 2.0); sun.castShadow = true; scene.add(sun);
  update = (T) => {

    const a = mix(-0.2, Math.PI + 0.2, u * 1.0); sunS.position.set(Math.cos(a) * -18, 3 + Math.sin(a) * 14, -25); sun.position.copy(sunS.position);
    camera.up.set(0, 1, 0); camera.position.set(mix(1.2, 3.0, u), mix(1.0, 3.4, smooth(u)), mix(3.4, 9.0, smooth(u))); camera.lookAt(0, mix(0.4, 2.6, smooth(u)), 0);

} else if (CEN === 'cidade') {
  // "eu vou junto com os dois": a janela dele e, longe, a dela, as duas com a mesma luz
  const c = createCidade(scene, 'noite');

finish(R, update, T0, CEN === 'quarto' || CEN === 'orando' || CEN === 'cidade' ? 0.5 : 0.28);
