<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'M'; font-weight: 700; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: 'M', sans-serif; }
canvas { display: block; }
#gancho { position: absolute; top: 290px; left: 90px; right: 90px; text-align: center; color: #fff; font-weight: 700; font-size: 58px; line-height: 1.22; text-shadow: 0 3px 14px rgba(0,0,0,.7); }
#gancho .c { color: #ff5c7a; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="gancho">posso orar pela sua ansiedade? <span class="c">♥</span></div>
<script type="module">
// Série de orações em 3D, plano de selfie. Uso: selfie3d.html?pose=fala|ora ; window.frame(T)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createPersonagem, setFace, setArm, setFingers } from './personagem3d.js';

const W = 1080, H = 1920, qs = new URLSearchParams(location.search), Q = +(qs.get('q') || 0.75), POSE = qs.get('pose') || 'fala';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W * Q, H * Q, false); Object.assign(renderer.domElement.style, { width: W + 'px', height: H + 'px' });
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e0b16);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.25;
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 30);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const std = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r });

// ---------- quarto à noite
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), std(0x3a3352)); wall.position.set(0, 1.8, -1.5); scene.add(wall);
const side = new THREE.Mesh(new THREE.PlaneGeometry(4, 5), std(0x2c2742)); side.rotation.y = -Math.PI / 2; side.position.set(1.6, 1.8, 0); scene.add(side);
const headboard = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 0.1), std(0x5a3b2e, 0.6)); headboard.position.set(-0.3, 0.9, -1.35); scene.add(headboard);
const pillow = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 20), new THREE.MeshPhysicalMaterial({ color: 0x7088b8, roughness: 0.9, sheen: 1 })); pillow.scale.set(1.3, 0.55, 0.6); pillow.position.set(-0.85, 1.15, -1.15); scene.add(pillow);
const win = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.3), new THREE.MeshBasicMaterial({ color: 0x24427a })); win.rotation.y = -Math.PI / 2; win.position.set(1.59, 1.95, -0.7); scene.add(win);
const moon = new THREE.Mesh(new THREE.CircleGeometry(0.09, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xf2f0e0).multiplyScalar(1.5) })); moon.rotation.y = -Math.PI / 2; moon.position.set(1.585, 2.3, -0.95); scene.add(moon);
const bulbs = [];
for (let i = 0; i < 30; i++) {
  const x = -2.6 + i * 0.18, y = 2.45 - 0.22 * Math.sin((i / 29) * Math.PI) - 0.04 * Math.sin(i * 1.7);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.024, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(i % 4 ? 0xffc56b : 0xff9ab8).multiplyScalar(2.4) })); b.position.set(x, y, -1.45); scene.add(b); bulbs.push(b);
}
const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.19, 0.22, 32, 1, true), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffb36b).multiplyScalar(1.8), side: THREE.DoubleSide })); shade.position.set(-1.25, 1.35, -0.95); scene.add(shade);

// luzes: abajur quente (principal), recorte frio da janela, preenchimento da tela do celular
const key = new THREE.SpotLight(0xffb27a, 9, 6, 0.75, 0.9, 1.6); key.position.set(-1.1, 2.0, 1.2); key.target.position.set(0, 1.55, 0); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.radius = 6; scene.add(key, key.target);
const lamp = new THREE.PointLight(0xffa060, 2.2, 3.5, 1.5); lamp.position.set(-1.2, 1.45, -0.7); scene.add(lamp);
const rim = new THREE.SpotLight(0x8fb0ff, 3, 5, 0.6, 0.8, 1.5); rim.position.set(1.2, 2.2, -1.2); rim.target.position.set(0, 1.55, 0); scene.add(rim, rim.target);
const fill = new THREE.PointLight(0xdfe8ff, 0.5, 2, 1.5); fill.position.set(0.1, 1.5, 0.75); scene.add(fill);
scene.add(new THREE.HemisphereLight(0x7a74a8, 0x2a1a20, 0.35));

// ---------- personagem e poses
const P = createPersonagem(); scene.add(P.root);
const ARMS = {
  baixo: { R: [V(-0.25, 0.92, 0.12), V(0.2, 0.3, 1), V(0.6, 0, -0.2), V(-1, -0.4, -0.3), { curl: 0.5 }], L: [V(0.25, 0.92, 0.12), V(-0.2, 0.3, 1), V(-0.6, 0, -0.2), V(1, -0.4, -0.3), { curl: 0.5 }] },
  ora: { R: [V(-0.024, 1.3, 0.2), V(0, 1, 0.3), V(1, 0, 0), V(-1, -0.7, -0.2), { curl: 0.05, spread: 0 }], L: [V(0.024, 1.3, 0.2), V(0, 1, 0.3), V(-1, 0, 0), V(1, -0.7, -0.2), { curl: 0.05, spread: 0 }] },
};
function pose(name, T = 0) {
  for (const s of ['R', 'L']) { const [w, f, p, pl, fg] = ARMS[name][s]; setArm(P, s, w, f, p, pl); setFingers(P.arms[s].hand, fg); }
}
function update(T) {
  const ora = POSE === 'ora';
  pose(ora ? 'ora' : 'baixo', T);
  setFace(P, ora ? { open: 0, talk: 0.25, browUp: 0.4, browSad: 0.6 } : { open: 1, talk: 0.45, smile: 0.5, browUp: 0.25, look: [0, 0] });
  P.head.rotation.set(ora ? 0.18 : 0.02, ora ? 0 : -0.06, ora ? 0.06 : 0.03);
  camera.position.set(0, 1.55, 1.0); camera.lookAt(0, 1.5, 0);
  return P.head.getWorldPosition(new THREE.Vector3());
}
const rt = new THREE.WebGLRenderTarget(W * Q, H * Q, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W * Q, H * Q), 0.5, 0.6, 0.9));
const bokeh = new BokehPass(scene, camera, { focus: 0.78, aperture: 0.01, maxblur: 0.01 }); composer.addPass(bokeh);
composer.addPass(new OutputPass());
window.frame = (T) => { const f = update(T); bokeh.uniforms.focus.value = camera.position.distanceTo(f); composer.render(); };
window.__scene = scene; window.__update = update; window.__THREE = THREE;
window.frame(0);
await document.fonts.ready; window.__ready = true;
</script>
</body>
</html>
