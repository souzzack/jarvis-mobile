<body>
<div id="gancho">posso orar pela sua ansiedade? <span class="c">♥</span></div>
<div id="cta">assistiu até o fim?<br>comenta <b>pelo que você quer<br>que eu ore</b> no próximo vídeo ↓</div>
<script type="module">
// Série de orações, boneco de cubos de quina viva, plano de selfie. Uso: selfie-boneco.html?pose=fala|mao|ora|cta  ou  ?t=4.5 ; window.frame(T)
import { THREE, V, rb, std, smooth, mix, setupRenderer, finish } from '../serie.js';
import { createPersonagem, setFace, setArm, setFingers } from './boneco.js';

const qs = new URLSearchParams(location.search), POSE = qs.get('pose');
const ctx = setupRenderer(), { scene, camera } = ctx;

// ---------- noite azul com pontinhos de luz desfocados (estrelas/bokeh) e piso em grade
scene.background = new THREE.Color(0x0b1033);
const sky = new THREE.Mesh(new THREE.PlaneGeometry(30, 18), new THREE.MeshBasicMaterial({ color: 0x141a52 })); sky.position.set(0, 4, -6); scene.add(sky);
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const bulbs = [];
{ let sd = 3; const rr = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  for (let i = 0; i < 140; i++) {
    const col = [0xffd27a, 0xff8fb0, 0x8fb8ff, 0xffffff][i % 4];
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: col, transparent: true, opacity: 0.35 + rr() * 0.5, depthWrite: false, blending: THREE.AdditiveBlending }));
    const z = -5.5 + rr() * 2.5; sp.position.set(-7 + rr() * 14, 0.5 + rr() * 8, z); sp.scale.setScalar(0.12 + rr() * 0.25); scene.add(sp); bulbs.push(sp);
  } }
const grid = new THREE.GridHelper(30, 40, 0x3a4cc8, 0x2a3590); grid.position.y = 0.0; grid.material.transparent = true; grid.material.opacity = 0.5; scene.add(grid);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x10164a, roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.01; scene.add(floor);
const key = new THREE.SpotLight(0xffd2a8, 45, 14, 0.7, 0.9, 1.4); key.position.set(-1.8, 4.2, 3.2); key.target.position.set(0, 2.8, 0); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; scene.add(key, key.target);
const rim = new THREE.SpotLight(0x7f8cff, 45, 10, 0.6, 0.8, 1.4); rim.position.set(2.4, 4.0, -2.2); rim.target.position.set(0, 2.8, 0); scene.add(rim, rim.target);
const rim2 = new THREE.SpotLight(0xb07fff, 25, 10, 0.6, 0.8, 1.4); rim2.position.set(-2.6, 3.6, -2.0); rim2.target.position.set(0, 2.6, 0); scene.add(rim2, rim2.target);
const fill = new THREE.PointLight(0xdfe8ff, 4, 5, 1.5); fill.position.set(0.3, 2.9, 2.6); scene.add(fill);
scene.add(new THREE.HemisphereLight(0x6a74c8, 0x14183a, 0.7));

// ---------- personagem (sentado na cama; só aparece do peito para cima)
const P = createPersonagem(); scene.add(P.root);
// poses dos braços: [punho, direção dos dedos, direção da palma, polo do cotovelo, dedos]
const ARMS = {
  R: { baixo: [V(-0.42, 1.3, 0.75), V(0.1, -0.2, 1), V(0, -1, 0), V(-1, -0.2, -0.4), { curl: 0.4 }],
       mao: [V(-0.66, 2.7, 0.62), V(0.08, 1, 0.1), V(0.1, 0, 1), V(-1, -1.2, 0.2), { curl: 0 }],
       ora: [V(-0.075, 1.76, 0.66), V(0, 1, 0.3), V(1, 0, 0), V(-1, -0.7, -0.2), { curl: 0 }] },
  L: { baixo: [V(0.42, 1.3, 0.75), V(-0.1, -0.2, 1), V(0, -1, 0), V(1, -0.2, -0.4), { curl: 0.4 }],
       fala: [V(0.42, 2.15, 0.7), V(-0.3, 0.8, 0.4), V(-0.3, 0.3, 0.9), V(1, -0.8, -0.2), { curl: 0.15 }],
       ora: [V(0.075, 1.76, 0.66), V(0, 1, 0.3), V(-1, 0, 0), V(1, -0.7, -0.2), { curl: 0 }],
       aponta: [V(0.3, 2.15, 0.7), V(-0.1, -1, 0.3), V(-0.3, 0, 1), V(1, -0.5, -0.4), { curl: 0.9 }] },
};
const lerpA = (side, A, B, k, T) => {
  const a = ARMS[side][A], b = ARMS[side][B], L = (i) => a[i].clone().lerp(b[i], k);
  const w = L(0).add(V(0, Math.sin(k * Math.PI) * 0.08, Math.sin(k * Math.PI) * 0.6)); // arco pela frente: a mão nunca atravessa o rosto
  if (A === 'fala' || B === 'fala') w.add(V(Math.sin(T * 2.3) * 0.05, Math.sin(T * 3.1) * 0.04, 0));
  setArm(P, side, w, L(1), L(2), L(3)); setFingers(P.arms[side].hand, { curl: mix(a[4].curl, b[4].curl, k) });
};
// roteiro do teste (12 s): fala → mão levantada (olhos fechados) → mãos juntas → chamada para comentar
const KEYS = [ // [t, braço direito, braço esquerdo, olhos, sorriso, inclinação, fala]
  [0, 'baixo', 'fala', 1, 0.4, 0, 1], [3, 'mao', 'baixo', 0, 0, 0.5, 1], [6, 'ora', 'ora', 0, 0.1, 1, 0.7], [9, 'baixo', 'aponta', 1, 1, 0, 1],
];
const FIXO = { fala: 1.5, mao: 4.5, ora: 7.5, cta: 10.5 };
function update(T) {
  if (POSE) T = FIXO[POSE] ?? 1.5;
  let i = 0; while (i < KEYS.length - 1 && KEYS[i + 1][0] <= T) i++;
  const cur = KEYS[i], prev = KEYS[Math.max(0, i - 1)], k = i === 0 ? 1 : smooth((T - cur[0]) / 0.7), L = (j) => mix(prev[j], cur[j], k);
  lerpA('R', prev[1], cur[1], k, T); lerpA('L', prev[2], cur[2], k, T);
  const eyes = L(3), sm = L(4), nod = L(5);
  const talk = cur[6] * Math.max(0, Math.sin(T * 10.5) * 0.55 + Math.sin(T * 6.7 + 1) * 0.35 + 0.1) * (((T * 0.8) % 1) < 0.82 ? 1 : 0);
  const blink = eyes > 0.5 && ((T * 0.31 + 0.2) % 1) > 0.965 ? 0 : eyes;
  setFace(P, { open: blink, talk: POSE === 'ora' ? 0 : talk, smile: sm, browUp: eyes < 0.5 ? 0.4 : 0.2 + 0.3 * sm, browSad: eyes < 0.5 ? 0.7 : 0 });
  P.head.rotation.set(0.04 + 0.2 * nod + Math.sin(T * 1.7) * 0.03, Math.sin(T * 0.8) * 0.06, Math.sin(T * 1.1) * 0.04 + (eyes < 0.5 ? 0.06 : 0));
  P.body.rotation.set(Math.sin(T * 1.2) * 0.01, Math.sin(T * 0.6) * 0.02, 0);
  // celular apoiado: balanço leve
  camera.position.set(Math.sin(T * 0.7) * 0.012, 2.75 + Math.sin(T * 1.1) * 0.008, 4.4); camera.lookAt(0, 2.55, 0); camera.rotation.z += Math.sin(T * 0.5) * 0.006;
  bulbs.forEach((b, j) => { b.material.opacity = 0.45 + 0.3 * Math.sin(T * 1.3 + j * 1.7); });
  document.getElementById('cta').style.opacity = smooth((T - 9.3) / 0.5); document.getElementById('gancho').style.opacity = 1 - smooth((T - 9) / 0.4);
  return P.head.getWorldPosition(new THREE.Vector3());
}
window.__range = [0, 12]; window.__shots = { SH01: [0, 12] };
finish(ctx, update, +(qs.get('t') || 0), 0.45);
await document.fonts.ready;
</script>
