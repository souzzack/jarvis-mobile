<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'M'; font-weight: 800; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1d5c63; font-family: 'M', sans-serif; }
svg { position: absolute; inset: 0; }
#gancho { position: absolute; top: 290px; left: 80px; right: 80px; text-align: center; color: #fff6e5; font-weight: 800; font-size: 60px; line-height: 1.18; }
#gancho span { background: #e8505b; padding: 4px 18px; border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
</style></head>
<body>
<!-- Estilo B: flat geométrico (sem contorno, cores chapadas, sombras longas). ?pose=fala | ora -->
<svg viewBox="0 0 1080 1920" width="1080" height="1920">
<!-- fundo: quarto em formas simples -->
<rect width="1080" height="1920" fill="#1d5c63"/>
<rect x="0" y="1180" width="1080" height="740" fill="#174a50"/>
<rect x="700" y="470" width="300" height="420" rx="24" fill="#0f3a40"/>
<rect x="720" y="490" width="260" height="380" rx="14" fill="#2b4a8a"/>
<circle cx="900" cy="580" r="44" fill="#ffe9b0"/><circle cx="920" cy="566" r="40" fill="#2b4a8a"/>
<rect x="845" y="490" width="10" height="380" fill="#0f3a40"/><rect x="720" y="670" width="260" height="10" fill="#0f3a40"/>
<g fill="#ffe9b0"><circle cx="760" cy="530" r="4"/><circle cx="800" cy="610" r="3"/><circle cx="950" cy="760" r="4"/><circle cx="780" cy="800" r="3"/></g>
<!-- planta -->
<rect x="110" y="1010" width="120" height="150" rx="12" fill="#e8505b"/>
<path d="M170 1010 C120 940 90 880 110 820 C150 870 170 930 170 1010 Z" fill="#7fc8a9"/>
<path d="M170 1010 C210 930 250 890 290 880 C280 940 230 990 170 1010 Z" fill="#5fae8d"/>
<path d="M170 1010 C160 920 170 850 200 790 C220 860 200 940 170 1010 Z" fill="#9adbbd"/>
<!-- luz do abajur (cunha de luz chapada) -->
<path d="M0 760 L520 1920 L0 1920 Z" fill="#ffd27a" opacity=".08"/>

<!-- sombra longa do personagem -->
<path d="M300 1300 L1080 1700 L1080 1920 L120 1920 Z" fill="#123e44" opacity=".55"/>
<!-- corpo -->
<path d="M30 1920 L30 1520 C30 1390 160 1310 330 1300 L750 1300 C920 1310 1050 1390 1050 1520 L1050 1920 Z" fill="#f2b134"/>
<path d="M540 1300 L750 1300 C920 1310 1050 1390 1050 1520 L1050 1920 L540 1920 Z" fill="#dc9a22"/>
<path d="M410 1300 L540 1420 L670 1300 Z" fill="#c6861a"/>
<rect x="480" y="1080" width="120" height="240" rx="20" fill="#7a4a2a"/>
<rect x="540" y="1080" width="60" height="240" fill="#6a3e22"/>
<g fill="#fff6e5"><rect x="490" y="1360" width="14" height="150" rx="7"/><rect x="576" y="1360" width="14" height="150" rx="7"/></g>
<!-- cabeça -->
<g id="cab" transform="translate(0 90)">
  <rect x="322" y="800" width="60" height="110" rx="30" fill="#8d5524"/><rect x="698" y="800" width="60" height="110" rx="30" fill="#7a4a1e"/>
  <rect x="350" y="570" width="380" height="560" rx="190" fill="#8d5524"/>
  <path d="M540 570 L540 1130 C640 1130 730 1050 730 940 L730 760 C730 655 645 570 540 570 Z" fill="#7a4a1e"/>
  <!-- cabelo: topo arredondado com risca -->
  <path d="M340 790 C330 640 420 540 540 540 C660 540 750 640 740 790 C720 720 680 690 640 680 L600 720 L570 680 C500 690 420 700 380 760 Z" fill="#1e1410"/>
  <rect x="560" y="560" width="12" height="90" rx="6" fill="#3a2a22" transform="rotate(20 566 600)"/>
  <!-- olhos simples -->
  <g id="olhosAbertos" fill="#1e1410"><ellipse cx="465" cy="860" rx="22" ry="30"/><ellipse cx="615" cy="860" rx="22" ry="30"/><circle cx="472" cy="850" r="7" fill="#fff6e5"/><circle cx="622" cy="850" r="7" fill="#fff6e5"/></g>
  <g id="olhosFechados" fill="none" stroke="#1e1410" stroke-width="12" stroke-linecap="round"><path d="M438 862 Q465 884 492 862"/><path d="M588 862 Q615 884 642 862"/></g>
  <g fill="#1e1410"><rect id="sobA" x="425" y="790" width="80" height="18" rx="9"/><rect id="sobB" x="575" y="790" width="80" height="18" rx="9"/></g>
  <circle cx="420" cy="950" r="26" fill="#c96a4a" opacity=".6"/><circle cx="660" cy="950" r="26" fill="#a85a3a" opacity=".6"/>
  <path d="M530 900 L556 950 L524 950" fill="#6a3e1a"/>
  <path id="bocaFala" d="M495 1010 L585 1010 C585 1050 560 1070 540 1070 C520 1070 495 1050 495 1010 Z" fill="#3a1a14"/>
  <rect id="bocaOra" x="510" y="1018" width="60" height="12" rx="6" fill="#3a1a14"/>
</g>
<!-- mãos juntas -->
<g id="maosOra" transform="translate(0 110)">
  <path d="M100 1810 L400 1440 L500 1500 L300 1810 Z" fill="#c6861a"/>
  <path d="M980 1810 L680 1440 L580 1500 L780 1810 Z" fill="#b3741a"/>
  <rect x="430" y="1400" width="100" height="70" rx="20" fill="#e8a02a"/><rect x="550" y="1400" width="100" height="70" rx="20" fill="#cf8c20"/>
  <path d="M536 1160 C496 1160 462 1260 462 1360 L462 1420 L536 1420 Z" fill="#a8683a"/>
  <path d="M544 1160 C584 1160 618 1260 618 1360 L618 1420 L544 1420 Z" fill="#94582e"/>
</g>
</svg>
<div id="gancho"><span>posso orar pela<br>sua ansiedade?</span></div>
<script>
const ora = (new URLSearchParams(location.search).get('pose') || 'fala') === 'ora';
const show = (id, on) => document.getElementById(id).style.display = on ? '' : 'none';
show('olhosAbertos', !ora); show('olhosFechados', ora); show('bocaFala', !ora); show('bocaOra', ora); show('maosOra', ora);
if (ora) { document.getElementById('cab').setAttribute('transform', 'translate(0 106) rotate(-3 540 1240)'); document.getElementById('sobA').setAttribute('transform', 'rotate(-8 505 799)'); document.getElementById('sobB').setAttribute('transform', 'rotate(8 575 799)'); }
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body></html>
