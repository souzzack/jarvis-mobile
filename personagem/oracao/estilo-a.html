  <g stroke="#b07058" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-40 -150 L-26 -168"/><path d="M-56 -80 L-34 -92"/><path d="M40 -150 L26 -168"/><path d="M56 -80 L34 -92"/><path d="M-56 30 C-62 -10 -66 -40 -64 -70"/></g>

<div id="gancho">posso orar pela sua ansiedade? <span class="c">♥</span></div>
<script>
const pose = new URLSearchParams(location.search).get('pose') || 'fala', ora = pose === 'ora';
const show = (id, on) => document.getElementById(id).style.display = on ? '' : 'none';
show('olhosAbertos', !ora); show('olhosFechados', ora); show('bocaFala', !ora); show('bocaOra', ora); show('maosOra', ora);
if (ora) { document.getElementById('cab').setAttribute('transform', 'translate(0 80) rotate(3 540 1220)'); document.getElementById('sobA').setAttribute('transform', 'rotate(-6 508 782)'); document.getElementById('sobB').setAttribute('transform', 'rotate(6 572 782)'); }
let h = ''; [[60,180,30],[200,140,22],[330,200,36],[470,150,20],[620,190,28],[760,140,24],[900,200,34],[1030,160,22],[120,1080,40],[980,1100,36],[60,1250,26]].forEach(([x,y,r],i) => {
  h += `<circle cx="${x}" cy="${y + 40}" r="${r}" fill="${i % 3 ? '#ffd28a' : '#ffb0c8'}" opacity=".55" filter="url(#b8)"/>`; });
document.getElementById('bokeh').innerHTML = h;
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body></html>
