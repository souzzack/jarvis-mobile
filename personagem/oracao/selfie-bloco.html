<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'M'; font-weight: 700; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2'); }
@font-face { font-family: 'M'; font-weight: 800; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: 'M', sans-serif; }
canvas { display: block; }
#gancho { position: absolute; top: 290px; left: 90px; right: 90px; text-align: center; color: #fff; font-weight: 700; font-size: 58px; line-height: 1.22; text-shadow: 0 3px 14px rgba(0,0,0,.75); }
#gancho .c { color: #ff5c7a; }
#cta { position: absolute; top: 290px; left: 60px; right: 60px; text-align: center; color: #fff; font-weight: 800; font-size: 52px; line-height: 1.2; opacity: 0; text-shadow: 0 3px 16px rgba(0,0,0,.85); }
#cta b { color: #ffd27a; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="gancho">posso orar pela sua ansiedade? <span class="c">♥</span></div>
<div id="cta">assistiu até o fim?<br>comenta <b>pelo que você quer<br>que eu ore</b> no próximo vídeo ↓</div>
<script type="module">
// Série de orações no estilo de blocos do Davi, plano de selfie. Uso: selfie-bloco.html?pose=fala|mao|ora|cta  ou  ?t=4.5 ; window.frame(T)
import { THREE, V, rb, std, smooth, mix, setupRenderer, finish } from '../serie.js';
import { createPersonagem, setFace, setArm, setFingers } from './gael.js';

const qs = new URLSearchParams(location.search), POSE = qs.get('pose');
const ctx = setupRenderer(), { scene, camera } = ctx;
scene.background = new THREE.Color(0x120d1c);

// ---------- quarto à noite (parede roxa, varal de luzinhas, abajur, janela azul, cabeceira)
const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 9), std(0x3d3456, 0.95)); wall.position.set(0, 3.2, -2.8); scene.add(wall);
const side = new THREE.Mesh(new THREE.PlaneGeometry(8, 9), std(0x2e2844, 0.95)); side.rotation.y = -Math.PI / 2; side.position.set(2.9, 3.2, 0); scene.add(side);
const head1 = rb(4.4, 2.0, 0.2, 0.08, std(0x5a3b2e, 0.6)); head1.position.set(-0.5, 1.6, -2.5); scene.add(head1);
const pillow = rb(1.6, 0.6, 0.7, 0.25, std(0x7088b8, 0.95)); pillow.position.set(-1.6, 2.0, -2.1); pillow.rotation.z = 0.08; scene.add(pillow);
const win = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.3), new THREE.MeshBasicMaterial({ color: 0x24427a })); win.rotation.y = -Math.PI / 2; win.position.set(2.88, 3.5, -1.3); scene.add(win);
const moon = new THREE.Mesh(new THREE.CircleGeometry(0.16, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xf2f0e0).multiplyScalar(1.5) })); moon.rotation.y = -Math.PI / 2; moon.position.set(2.87, 4.1, -1.7); scene.add(moon);
const bulbs = [];
for (let i = 0; i < 30; i++) {
  const x = -4.7 + i * 0.33, y = 4.45 - 0.4 * Math.sin((i / 29) * Math.PI) - 0.07 * Math.sin(i * 1.7);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(i % 4 ? 0xffc56b : 0xff9ab8).multiplyScalar(2.4) })); b.position.set(x, y, -2.75); scene.add(b); bulbs.push(b);
}
const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.34, 0.4, 32, 1, true), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffb36b).multiplyScalar(1.8), side: THREE.DoubleSide })); shade.position.set(-2.3, 2.45, -1.8); scene.add(shade);
const key = new THREE.SpotLight(0xffb27a, 60, 14, 0.7, 0.9, 1.4); key.position.set(-2.2, 4.0, 2.4); key.target.position.set(0, 2.8, 0); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; scene.add(key, key.target);
const lamp = new THREE.PointLight(0xffa060, 10, 7, 1.5); lamp.position.set(-2.2, 2.6, -1.3); scene.add(lamp);
const rim = new THREE.SpotLight(0x8fb0ff, 25, 10, 0.6, 0.8, 1.4); rim.position.set(2.2, 4.0, -2.2); rim.target.position.set(0, 2.8, 0); scene.add(rim, rim.target);
const fill = new THREE.PointLight(0xdfe8ff, 3, 4, 1.5); fill.position.set(0.2, 2.8, 2.6); scene.add(fill); // tela do celular
scene.add(new THREE.HemisphereLight(0x7a74a8, 0x2a1a20, 0.6));

// ---------- personagem (sentado na cama; só aparece do peito para cima)
const P = createPersonagem(); scene.add(P.root);
// poses dos braços: [punho, direção dos dedos, direção da palma, polo do cotovelo, dedos]
const ARMS = {
  R: { baixo: [V(-0.42, 1.3, 0.75), V(0.1, -0.2, 1), V(0, -1, 0), V(-1, -0.2, -0.4), { curl: 0.4 }],
       mao: [V(-0.66, 2.7, 0.62), V(0.08, 1, 0.1), V(0.1, 0, 1), V(-1, -1.2, 0.2), { curl: 0 }],
       ora: [V(-0.07, 1.9, 0.62), V(0, 1, 0.3), V(1, 0, 0), V(-1, -0.7, -0.2), { curl: 0 }] },
  L: { baixo: [V(0.42, 1.3, 0.75), V(-0.1, -0.2, 1), V(0, -1, 0), V(1, -0.2, -0.4), { curl: 0.4 }],
       fala: [V(0.42, 2.15, 0.7), V(-0.3, 0.8, 0.4), V(-0.3, 0.3, 0.9), V(1, -0.8, -0.2), { curl: 0.15 }],
       ora: [V(0.07, 1.9, 0.62), V(0, 1, 0.3), V(-1, 0, 0), V(1, -0.7, -0.2), { curl: 0 }],
       aponta: [V(0.3, 2.15, 0.7), V(-0.1, -1, 0.3), V(-0.3, 0, 1), V(1, -0.5, -0.4), { curl: 0.9 }] },
};
const lerpA = (side, A, B, k, T) => {
  const a = ARMS[side][A], b = ARMS[side][B], L = (i) => a[i].clone().lerp(b[i], k);
  const w = L(0).add(V(0, Math.sin(k * Math.PI) * 0.08, Math.sin(k * Math.PI) * 0.6)); // arco pela frente: a mão nunca atravessa o rosto
  if (A === 'fala' || B === 'fala') w.add(V(Math.sin(T * 2.3) * 0.05, Math.sin(T * 3.1) * 0.04, 0));
  setArm(P, side, w, L(1), L(2), L(3)); setFingers(P.arms[side].hand, { curl: mix(a[4].curl, b[4].curl, k) });
};
// roteiro do teste (12 s): fala → mão levantada (olhos fechados) → mãos juntas → chamada para comentar
const KEYS = [ // [t, braço direito, braço esquerdo, olhos, sorriso, inclinação, fala]
  [0, 'baixo', 'fala', 1, 0.4, 0, 1], [3, 'mao', 'baixo', 0, 0, 0.5, 1], [6, 'ora', 'ora', 0, 0.1, 1, 0.7], [9, 'baixo', 'aponta', 1, 1, 0, 1],
];
const FIXO = { fala: 1.5, mao: 4.5, ora: 7.5, cta: 10.5 };
function update(T) {
  if (POSE) T = FIXO[POSE] ?? 1.5;
  let i = 0; while (i < KEYS.length - 1 && KEYS[i + 1][0] <= T) i++;
  const cur = KEYS[i], prev = KEYS[Math.max(0, i - 1)], k = i === 0 ? 1 : smooth((T - cur[0]) / 0.7), L = (j) => mix(prev[j], cur[j], k);
  lerpA('R', prev[1], cur[1], k, T); lerpA('L', prev[2], cur[2], k, T);
  const eyes = L(3), sm = L(4), nod = L(5);
  const talk = cur[6] * Math.max(0, Math.sin(T * 10.5) * 0.55 + Math.sin(T * 6.7 + 1) * 0.35 + 0.1) * (((T * 0.8) % 1) < 0.82 ? 1 : 0);
  const blink = eyes > 0.5 && ((T * 0.31 + 0.2) % 1) > 0.965 ? 0 : eyes;
  setFace(P, { open: blink, talk: POSE === 'ora' ? 0 : talk, smile: sm, browUp: eyes < 0.5 ? 0.4 : 0.2 + 0.3 * sm, browSad: eyes < 0.5 ? 0.7 : 0 });
  P.head.rotation.set(0.04 + 0.2 * nod + Math.sin(T * 1.7) * 0.03, Math.sin(T * 0.8) * 0.06, Math.sin(T * 1.1) * 0.04 + (eyes < 0.5 ? 0.06 : 0));
  P.body.rotation.set(Math.sin(T * 1.2) * 0.01, Math.sin(T * 0.6) * 0.02, 0);
  // celular apoiado: balanço leve
  camera.position.set(Math.sin(T * 0.7) * 0.012, 2.75 + Math.sin(T * 1.1) * 0.008, 4.4); camera.lookAt(0, 2.55, 0); camera.rotation.z += Math.sin(T * 0.5) * 0.006;
  bulbs.forEach((b, j) => b.material.color.setRGB(2.3 * (0.85 + 0.15 * Math.sin(T * 2 + j)), 1.7 * (0.85 + 0.15 * Math.sin(T * 2 + j)), 0.9));
  document.getElementById('cta').style.opacity = smooth((T - 9.3) / 0.5); document.getElementById('gancho').style.opacity = 1 - smooth((T - 9) / 0.4);
  return P.head.getWorldPosition(new THREE.Vector3());
}
window.__range = [0, 12]; window.__shots = { SH01: [0, 12] };
finish(ctx, update, +(qs.get('t') || 0), 0.45);
await document.fonts.ready;
</script>
</body>
</html>
