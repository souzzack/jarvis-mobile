<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = (x) => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // entra com leve passada

// luzinhas (bokeh)
(() => { let h = ''; for (let i = 0; i < 16; i++) { const x = -30 + i * 76, y = 230 + 70 * Math.sin(i / 15 * Math.PI) * -1 + 120 + (i % 2) * 14;
  h += `<circle class="lz" cx="${x}" cy="${y}" r="${20 + (i % 3) * 5}" fill="#ffd28a" opacity=".9" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="${9 + (i % 3) * 2}" fill="#fff4dc" opacity=".9"/>`; }
  $('luzinhas').innerHTML = h; })();

// boca: talk 0..1 (abertura), smile 0..1
function setMouth(talk, smile) {
  const w = 62 + 14 * smile - 10 * talk, cy = -10 * smile;
  if (talk < 0.06) {
    $('bocaFechada').setAttribute('d', `M${-w} ${cy} Q0 ${8 + 26 * smile} ${w} ${cy}`);
    $('bocaAberta').setAttribute('d', ''); $('mouthClipP').setAttribute('d', ''); return;
  }
  const top = -10 - 6 * talk + 6 * smile, bot = 14 + 70 * talk + 14 * smile;
  const d = `M${-w} ${cy} C${-w * 0.6} ${top} ${w * 0.6} ${top} ${w} ${cy} C${w * 0.8} ${bot} ${-w * 0.8} ${bot} ${-w} ${cy} Z`;
  $('bocaAberta').setAttribute('d', d); $('mouthClipP').setAttribute('d', d); $('bocaFechada').setAttribute('d', '');
  $('dentes').setAttribute('height', 26 + 6 * talk); $('dentes').setAttribute('y', top - 6);
  $('lingua').setAttribute('cy', bot - 4);
}
// olhos: open 0..1 (pálpebra desce), fechado (< 0.1) mostra o arco tranquilo da oração
function setEyes(open, look = [0, 0]) {
  for (const id of ['olhoL', 'olhoR']) {
    const g = $(id), shut = open < 0.1;
    g.querySelector('.aberto').style.display = shut ? 'none' : ''; g.querySelector('.fechado').style.display = shut ? '' : 'none';
    g.querySelector('.palp').setAttribute('height', 22 + 60 * (1 - open) * 0.95);
    g.querySelector('.iris').setAttribute('transform', `translate(${look[0] * 14} ${look[1] * 10})`);
  }
}
function setBrows(up, sad) { // up: levanta; sad: pontas internas sobem (compaixão)
  $('sobL').setAttribute('transform', `translate(0 ${-14 * up}) rotate(${-10 * sad} 505 758)`);
  $('sobR').setAttribute('transform', `translate(0 ${-14 * up}) rotate(${10 * sad} 575 758)`);
}
// mãos: cada pose é [x, y, rotação, escala]; fora = abaixo do quadro
const HANDS = {
  maoLev: { on: [235, 820, -8, 1.0], off: [180, 1750, 10, 1.0] },
  maoOra: { on: [540, 1445, 0, 1.0], off: [540, 2150, 0, 1.0] },
  maoAponta: { on: [740, 1470, 0, 1.2], off: [1000, 2150, -20, 0.95] },
  maoFala: { on: [830, 1460, 14, 0.95], off: [900, 2100, 20, 0.95] },
};
function hand(id, k, T) {
  const a = HANDS[id].off, b = HANDS[id].on, e = back(k), m = (i) => a[i] + (b[i] - a[i]) * e;
  let x = m(0), y = m(1), r = m(2);
  if (id === 'maoFala') { x += Math.sin(T * 2.6) * 18; y += Math.sin(T * 3.4) * 22; r += Math.sin(T * 2.1) * 6; }
  if (id === 'maoLev') { r += Math.sin(T * 1.3) * 2.5; }
  if (id === 'maoAponta') { y += Math.abs(Math.sin(T * 4.2)) * 26; }
  $(id).setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${m(3)})`);
  $(id).style.display = k <= 0.001 ? 'none' : '';
}

// roteiro do teste (12 s): fala → olhos fechados com a mão levantada → mãos juntas → chamada para comentar
const KEYS = [ // [tempo, {mãos ligadas}, olhos, sorriso, inclinação, fala, compaixão]
  [0, { maoFala: 1 }, 1, 0.35, 0, 1, 0.3], [3, { maoLev: 1 }, 0, 0, 0.6, 1, 0.8], [6, { maoOra: 1 }, 0, 0.1, 1, 0.75, 0.7], [9, { maoAponta: 1 }, 1, 1, 0, 1, 0],
];
const TR = 0.6;
window.frame = (T) => {
  let i = 0; while (i < KEYS.length - 1 && KEYS[i + 1][0] <= T) i++;
  const cur = KEYS[i], prev = KEYS[Math.max(0, i - 1)], k = i === 0 ? 1 : smooth((T - cur[0]) / TR);
  const dt = T - cur[0]; // a mão que sai desce primeiro (0,4 s); a que entra sobe depois
  for (const id in HANDS) hand(id, i === 0 ? (cur[1][id] || 0) : Math.max((cur[1][id] || 0) * clamp((dt - 0.35) / 0.6), (prev[1][id] || 0) * (1 - smooth(dt / 0.4))), T);
  const L = (j) => prev[j] + (cur[j] - prev[j]) * k;
  const eyes = L(2), smile = L(3), nod = L(4), sad = L(6);
  // fala sintética (no episódio vem do envelope da voz gravada)
  const syl = Math.max(0, Math.sin(T * 10.5) * 0.55 + Math.sin(T * 6.7 + 1) * 0.35 + 0.1), pause = ((T * 0.8) % 1) < 0.82 ? 1 : 0;
  setMouth(cur[5] * syl * pause, smile);
  const blink = eyes > 0.5 && ((T * 0.31 + 0.2) % 1) > 0.965 ? 0.05 : eyes;
  setEyes(blink < 0.1 ? 0 : Math.min(1, 0.82 + 0.18 * blink), [Math.sin(T * 0.7) * 0.15, 0.05]);
  setBrows(eyes < 0.5 ? 0.35 : 0.15 + 0.35 * smile, sad);
  $('feicoes').setAttribute('transform', `translate(0 ${14 * nod})`);
  const tilt = Math.sin(T * 1.1) * 2.2 + (eyes < 0.5 ? 3 : 0), bob = Math.sin(T * 1.7) * 5 + 8 * nod;
  $('cabeca').setAttribute('transform', `translate(0 ${bob}) rotate(${tilt} 540 1150)`);
  $('corpo').setAttribute('transform', `translate(0 ${Math.sin(T * 1.2) * 4})`);
  // celular apoiado: balanço bem leve
  $('cam').setAttribute('transform', `translate(${Math.sin(T * 0.7) * 6} ${Math.sin(T * 0.9) * 5}) rotate(${Math.sin(T * 0.5) * 0.5} 540 960)`);
  document.querySelectorAll('.lz').forEach((c, j) => c.setAttribute('opacity', 0.65 + 0.3 * Math.sin(T * 1.8 + j)));
  $('cta').style.opacity = smooth((T - 9.3) / 0.5); $('gancho').style.opacity = 1 - smooth((T - 9) / 0.4);
};
window.__range = [0, 12];
window.frame(+(new URLSearchParams(location.search).get('t') || 0));
document.fonts.ready.then(() => { window.__ready = true; });
