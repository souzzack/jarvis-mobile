<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 600; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Capa do episódio (sem número): quadro do vídeo com tratamento de cor do tema, raios e partículas de luz,
// título grande com brilho, marca da série no topo e o versículo embaixo.
// Uso: capa.html?img=<quadro>&l1=...&l2=...&tag=...&verso=...&cor=f2c14e&zoom=1.12&fx=0.5&fy=0.45&luz=0.2
const P = new URLSearchParams(location.search);
const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const cor = '#' + (P.get('cor') || 'f2c14e'), zoom = +(P.get('zoom') || 1.12), fy = +(P.get('fy') || 0.45), fx = +(P.get('fx') || 0.5), luzX = +(P.get('luz') || 0.22);
for (const f of ['900 100px Montserrat', '800 40px Montserrat', '600 40px Montserrat']) await document.fonts.load(f);
const img = new Image(); img.src = P.get('img'); await img.decode();
const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };

// 1. imagem com zoom e contraste
const iw = W * zoom, ih = H * zoom;
ctx.filter = 'contrast(1.12) saturate(1.2) brightness(1.02)';
ctx.drawImage(img, -(iw - W) * fx, -(ih - H) * fy, iw, ih); ctx.filter = 'none';
// 2. tratamento de cor do tema (sombras puxadas para azul-noite, luzes na cor do tema)
ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = hex(cor, 0.35); ctx.fillRect(0, 0, W, H);
ctx.globalCompositeOperation = 'multiply'; let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5a5f8a'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#3a3f6a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
ctx.globalCompositeOperation = 'source-over';
// 3. raios de luz descendo do alto (a luz da janela)
ctx.globalCompositeOperation = 'screen';
const ox = W * luzX, oy = -120;
for (let i = 0; i < 7; i++) {
  const a = 0.35 + i * 0.13 + (rnd() - 0.5) * 0.05, w = 0.035 + rnd() * 0.05, len = H * 1.25;
  const rg = ctx.createLinearGradient(ox, oy, ox + Math.cos(a) * len, oy + Math.sin(a) * len);
  rg.addColorStop(0, hex(cor, 0.32)); rg.addColorStop(0.55, hex(cor, 0.08)); rg.addColorStop(1, hex(cor, 0));
  ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(ox, oy);
  ctx.lineTo(ox + Math.cos(a - w) * len, oy + Math.sin(a - w) * len); ctx.lineTo(ox + Math.cos(a + w) * len, oy + Math.sin(a + w) * len); ctx.closePath(); ctx.fill();
}
const glow = ctx.createRadialGradient(ox, 0, 0, ox, 0, 700); glow.addColorStop(0, hex(cor, 0.55)); glow.addColorStop(1, hex(cor, 0)); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
// partículas de luz (bokeh)
for (let i = 0; i < 46; i++) {
  const x = rnd() * W, y = rnd() * H * 0.95, r = 3 + rnd() * rnd() * 22, a = 0.12 + rnd() * 0.45;
  const bg = ctx.createRadialGradient(x, y, 0, x, y, r); bg.addColorStop(0, `rgba(255,244,214,${a})`); bg.addColorStop(0.6, hex(cor, a * 0.4)); bg.addColorStop(1, hex(cor, 0));
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
ctx.globalCompositeOperation = 'source-over';
// 4. escurecimento para o texto + vinheta
g = ctx.createLinearGradient(0, 0, 0, H);
g.addColorStop(0, 'rgba(5,6,16,0.6)'); g.addColorStop(0.16, 'rgba(5,6,16,0)'); g.addColorStop(0.52, 'rgba(5,6,16,0)'); g.addColorStop(0.72, 'rgba(5,6,16,0.72)'); g.addColorStop(1, 'rgba(5,6,16,0.95)');
ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
const vg = ctx.createRadialGradient(W / 2, H * 0.42, H * 0.28, W / 2, H * 0.5, H * 0.82); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
// grão de filme
const gr = ctx.createImageData(W, H); for (let i = 0; i < gr.data.length; i += 4) { const v = rnd() * 255; gr.data[i] = gr.data[i + 1] = gr.data[i + 2] = v; gr.data[i + 3] = 10; }
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; tmp.getContext('2d').putImageData(gr, 0, 0); ctx.drawImage(tmp, 0, 0);

ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
// 5. moldura fina
ctx.strokeStyle = hex(cor, 0.55); ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(36, 36, W - 72, H - 72, 34); ctx.stroke();
ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(48, 48, W - 96, H - 96, 26); ctx.stroke();
// 6. marca da série no topo (janela com luz + nome)
const mx = W / 2, my = 300;
ctx.save(); ctx.shadowColor = hex(cor, 0.9); ctx.shadowBlur = 24; ctx.fillStyle = hex(cor, 1);
ctx.beginPath(); ctx.roundRect(mx - 210, my - 22, 40, 44, 6); ctx.fill(); ctx.restore();
ctx.fillStyle = 'rgba(10,10,20,0.85)'; ctx.fillRect(mx - 191.5, my - 22, 3, 44); ctx.fillRect(mx - 210, my - 1.5, 40, 3);
ctx.font = '800 40px Montserrat'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.fillText('DAVI', mx - 150, my + 2);
const wDavi = ctx.measureText('DAVI ').width; ctx.fillStyle = cor; ctx.fillText('&', mx - 150 + wDavi, my + 2);
const wAmp = ctx.measureText('& ').width; ctx.fillStyle = '#ffffff'; ctx.fillText('DEUS', mx - 150 + wDavi + wAmp, my + 2);
ctx.textAlign = 'center';
// 7. selo do tema acima do título
const tag = (P.get('tag') || '').toUpperCase();
const fitW = (t, font, max) => { ctx.font = font; return ctx.measureText(t).width > max; };
const l1 = (P.get('l1') || '').toUpperCase(), l2 = (P.get('l2') || '').toUpperCase();
const sizeFor = (t, base, max = 960) => { ctx.font = `900 ${base}px Montserrat`; return Math.min(base, base * max / ctx.measureText(t).width); };
const s1 = sizeFor(l1, 120), s2 = sizeFor(l2, 140), k = Math.min(s1 / 120, s2 / 140);
const y1 = 1300, y2 = y1 + 150 * k;
if (tag) {
  ctx.font = '800 32px Montserrat'; ctx.letterSpacing = '6px'; const tw = ctx.measureText(tag).width + 70;
  ctx.fillStyle = 'rgba(8,8,18,0.55)'; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, y1 - 140 * k - 36, tw, 64, 32); ctx.fill();
  ctx.strokeStyle = hex(cor, 0.85); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = cor; ctx.fillText(tag, W / 2 + 3, y1 - 140 * k - 3); ctx.letterSpacing = '0px';
}
// 8. título: linha 1 branca, linha 2 com degradê na cor do tema, contorno grosso e brilho
const title = (t, y, size, fill) => {
  ctx.font = `900 ${size}px Montserrat`; ctx.lineJoin = 'round';
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.strokeStyle = 'rgba(6,5,12,0.98)'; ctx.lineWidth = size * 0.2; ctx.strokeText(t, W / 2, y); ctx.restore();
  ctx.save(); ctx.shadowColor = typeof fill === 'string' ? 'rgba(255,255,255,0.25)' : hex(cor, 0.85); ctx.shadowBlur = 28; ctx.fillStyle = fill; ctx.fillText(t, W / 2, y); ctx.restore();
};
title(l1, y1, 120 * k, '#ffffff');
const tg = ctx.createLinearGradient(0, y2 - 70 * k, 0, y2 + 70 * k); tg.addColorStop(0, '#fff6dc'); tg.addColorStop(0.45, cor); tg.addColorStop(1, hex(cor, 1));
title(l2, y2, 140 * k, tg);
// 9. linha decorativa + versículo
const vy = y2 + 130 * k;
ctx.strokeStyle = hex(cor, 0.7); ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(W / 2 - 170, vy); ctx.lineTo(W / 2 - 30, vy); ctx.moveTo(W / 2 + 30, vy); ctx.lineTo(W / 2 + 170, vy); ctx.stroke();
ctx.save(); ctx.translate(W / 2, vy); ctx.rotate(Math.PI / 4); ctx.fillStyle = cor; ctx.fillRect(-7, -7, 14, 14); ctx.restore();
const verso = P.get('verso');
if (verso) { ctx.font = '600 34px Montserrat'; ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.fillText(verso, W / 2, vy + 62); }
window.__ready = true;
</script>
</body>
</html>
