import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

import { createDavi, setFace } from './davi.js';
const W = 1080, H = 1920;

renderer.setPixelRatio(window.devicePixelRatio || 1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);

d.arms.L.sh.rotation.set(-0.9, 0, 0.1); d.arms.L.elbow.rotation.set(-0.2, 0, 0);

const body = new THREE.Mesh(new RoundedBoxGeometry(1.05, 0.68, 0.04, 2, 0.02), paper); env.add(body);
const flapG = new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(-0.52, 0.33), new THREE.Vector2(0.52, 0.33), new THREE.Vector2(0, -0.05)]));

const hm = new THREE.Mesh(new THREE.ShapeGeometry(heart), new THREE.MeshBasicMaterial({ color: 0xffe8e8 })); hm.position.set(0, -0.02, 0.027); env.add(hm);
