<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0706; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createStudio, keyPos, W, H } from './estudio.js';
import { createMascot } from './mascote.js';
import { telaTimeline, telaRender, telaPedido, telaFinal } from './telas.js';

// Vídeo descontraído: "Coisas que ninguém te conta sobre ser uma IA".
// Planos: H1 R1 M1 C1 C2 B1 S1 W1. Uso: video3.html?shot=R1; window.frame(u) com u em segundos dentro do plano.
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => smooth((t - a) / (b - a));
const mix = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const STAND = { armR: 0, armL: -0.25, rp: [1.42, 1.06, 0.36], rr: [0, 0, -0.06], ry: -0.01 };
const HERO = { armR: 1.35, armL: -0.25, rp: [1.2, 1.75, 0.3], rr: [0, 0, 0.12], ry: 0.65 };
const STAR = { armR: 1.1, armL: -0.25, rp: [1.1, 1.85, 0.3], rr: [0, 0, 0.55], ry: 0.5 };
const SHOULDER = { armR: 1.0, armL: -0.25, rp: [1.22, 1.41, 0.3], rr: [-0.45, 0, -0.4], ry: 0.85 };
function pose(m, A, B, k) {
  m.armR.rotation.z = mix(A.armR, B.armR, k);
  m.armL.rotation.z = mix(A.armL, B.armL, k);
  m.rulerPivot.position.set(...A.rp.map((v, i) => mix(v, B.rp[i], k)));
  m.rulerPivot.rotation.set(...A.rr.map((v, i) => mix(v, B.rr[i], k)));
  m.ruler.position.y = mix(A.ry, B.ry, k);
}
function eyes(m, open) { m.eyes.forEach(({ eye, s1, s2 }) => { eye.scale.y = Math.max(0.08, open); s1.visible = s2.visible = open > 0.45; }); }
const blink = (t, at) => 1 - Math.max(0, 1 - Math.abs(t - at) / 0.07);
function star(m, v) { m.star.material.emissiveIntensity = 5 * v; m.starLight.intensity = 6 * v; }
function sit(m, s) {
  const drop = (m.legH - 0.19) * s;
  m.body.position.y = -drop;
  m.legs.forEach(l => { l.rotation.x = -Math.PI / 2 * s; l.position.y = m.legH - drop; l.visible = l.position.z > 0 || s < 0.6; });
}

const POINT_FWD = { armR: 0.6, armL: -0.45, rp: [1.33, 1.31, 0.31], rr: [0.75, 0, -0.35], ry: 0.6 };
const SCREENS = {
  H1: { draw: (g, w, h) => telaTimeline(g, w, h), intensity: 0.35 },
  R1: { draw: (g, w, h) => telaTimeline(g, w, h), intensity: 0.6, pressedKey: [3, 9] },
  M1: { draw: (g, w, h) => telaTimeline(g, w, h) },
  M2: { draw: (g, w, h) => telaTimeline(g, w, h), intensity: 0.5 },
  C1: { draw: (g, w, h) => telaRender(g, w, h, { n: 0 }) },
  C2: { draw: (g, w, h) => telaRender(g, w, h, { n: 3 }) },
  B1: { draw: (g, w, h) => telaPedido(g, w, h, { typing: 0 }) },
  S1A: { draw: (g, w, h) => telaTimeline(g, w, h, { arrange: 0 }) },
  S1B: { draw: telaFinal, intensity: 0.5, finale: true },
  W1: { draw: telaFinal, intensity: 0.5, finale: true },
};
const S = SCREENS[SHOT];
const studio = createStudio({ drawScreen: S.draw, screenIntensity: S.intensity ?? 0.95, pressedKey: S.pressedKey ?? null, showMug: !S.finale, screenScale: 1, shadowSize: 1024 });
const { scene } = studio;
const m = createMascot();
scene.add(m.root);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
const head = () => m.root.position.clone().add(V(0, 1.95 + m.body.position.y, 0));
const screenNormal = V(0, Math.sin(0.22), Math.cos(0.22));

function finaleLights(soft = 1) {
  const back = new THREE.SpotLight(0xff7a2a, 150 * soft, 20, 0.5, 0.7, 1.5);
  back.position.set(m.root.position.x, 6.5, m.root.position.z - 4.5); back.target = m.root; scene.add(back);
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,140,60,0.9)'); gr.addColorStop(0.4, 'rgba(255,100,30,0.35)'); gr.addColorStop(1, 'rgba(255,80,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: soft }));
  halo.position.set(m.root.position.x, 2.6, m.root.position.z - 1.6); scene.add(halo);
  studio.key.intensity = 25; studio.fill.intensity = 18;
}

let update;
switch (SHOT) {
  case 'H1': { // close dramático de "documentário"; a estrela falha no fim
    const p = keyPos(2, 5); m.root.position.copy(p);
    update = (u) => {
      pose(m, STAND, STAND, 0);
      eyes(m, 0.58 * blink(u, 1.2));
      const flick = (u > 2.55 && u < 2.62) || (u > 2.72 && u < 2.78) ? 0.15 : 0.75;
      star(m, flick);
      m.head.rotation.x = -0.04;
      const k = smooth(u / 3.4);
      camera.position.set(p.x + 0.2, 2.55, mix(p.z + 9.5, p.z + 5.0, k));
      camera.lookAt(p.x, 2.62, p.z);
      return head();
    };
    break;
  }
  case 'R1': { // olha o bracinho ("não tenho mãos"), pose de herói, a régua cai depois de "decorativa"
    const P = studio.pressed, kp = P.pos;
    m.root.position.set(kp.x - 2.3, kp.y, kp.z - 0.4);
    const r = m.root.position;
    const LYING_POS = [2.3, 0.12, 0.4], LYING_ROT = [0, 0, -Math.PI / 2];
    const FALL = 5.06, LAND = 5.5;
    update = (u) => {
      star(m, 1); m.head.rotation.set(0, 0, 0); m.body.rotation.x = 0;
      const hero = seg(u, 2.4, 3.1);
      pose(m, STAND, HERO, hero);
      // "eu não tenho mãos": levanta o bracinho esquerdo e olha para ele
      const look = seg(u, 1.05, 1.35) * (1 - seg(u, 2.2, 2.5));
      m.armL.rotation.z = mix(m.armL.rotation.z, -1.1 + Math.sin(u * 14) * 0.12, look);
      m.head.rotation.y = -0.55 * look; m.head.rotation.x = 0.28 * look;
      if (hero > 0) { m.body.rotation.x = -0.06 * hero; m.head.rotation.x += -0.12 * hero; }
      const f = clamp((u - FALL) / (LAND - FALL)), g = f * f;
      if (u >= FALL) {
        m.rulerPivot.position.set(mix(HERO.rp[0], LYING_POS[0], f), mix(HERO.rp[1], LYING_POS[1], g), mix(HERO.rp[2], LYING_POS[2], f));
        const wob = u > LAND ? Math.sin((u - LAND) * 30) * 0.08 * Math.max(0, 1 - (u - LAND) / 0.4) : 0;
        m.rulerPivot.rotation.set(0, 0, mix(HERO.rr[2], LYING_ROT[2], g) + wob);
        m.ruler.position.y = mix(HERO.ry, 0, f);
        m.armR.rotation.z = mix(HERO.armR, 0.1, seg(u, FALL + 0.3, FALL + 0.9));
      }
      const hit = seg(u, LAND - 0.02, LAND + 0.03), glow = hit * (1 - 0.5 * seg(u, LAND + 0.2, LAND + 1.0));
      P.key.position.y = mix(0.58, 0.5, hit * (1 - 0.6 * seg(u, LAND + 0.15, LAND + 0.45)));
      P.legend.position.y = P.key.position.y + 0.121;
      P.mat.emissiveIntensity = 1.4 * glow; P.light.intensity = 9 * glow;
      if (u > LAND) {
        m.body.rotation.x = 0;
        const dn = seg(u, LAND + 0.05, LAND + 0.3) * (1 - seg(u, LAND + 0.6, LAND + 0.75));
        m.head.rotation.y = 0.45 * dn; m.head.rotation.x = 0.22 * dn;
      }
      eyes(m, u > LAND + 0.75 ? 0.5 : u < 1.0 ? blink(u, 0.5) : 1);
      if (u < LAND) {
        camera.position.set(r.x + 1.6, mix(1.1, 1.35, u / LAND), r.z + mix(8.2, 7.2, u / LAND));
        camera.lookAt(r.x + 0.5, 2.8, r.z);
        return r.clone().add(V(0.5, 2.2, 0));
      }
      camera.position.set(r.x + 0.9, 2.6, r.z + mix(8.6, 8.1, (u - LAND) / 1.0));
      camera.lookAt(r.x + 0.75, 2.0, r.z);
      return r.clone().add(V(1.1, 1.4, 0));
    };
    break;
  }
  case 'M1': { // dança fora do ritmo; a música para em 4,85 s e ele continua por dois tempos
    const p = keyPos(2, 5); m.root.position.copy(p);
    update = (u) => {
      pose(m, STAND, STAND, 0); star(m, 1);
      const on = u < 5.65 ? 1 : 0;
      const b = Math.max(0, Math.sin(2 * Math.PI * (u * 2.0 + 0.37))) * on;
      m.head.rotation.x = 0.24 * b; m.body.position.y = 0.05 * b; m.root.rotation.z = 0.05 * Math.sin(u * 2 * Math.PI) * on;
      eyes(m, on ? 0.55 : blink(u, 6.0));
      m.head.rotation.y = u > 5.7 ? -0.35 * seg(u, 5.7, 5.82) + 0.35 * seg(u, 5.95, 6.1) : 0;
      camera.position.set(p.x + 0.6, 2.5, mix(p.z + 8.2, p.z + 6.6, smooth(u / 6.15)));
      camera.lookAt(p.x, 2.2, p.z);
      return head();
    };
    break;
  }
  case 'M2': { // close nos fones: "os fones também são decorativos"
    const p = keyPos(2, 5); m.root.position.copy(p); m.root.rotation.y = 1.15;
    update = (u) => {
      pose(m, STAND, STAND, 0); star(m, 1);
      const tap = seg(u, 0.5, 0.8) * (1 - seg(u, 1.8, 2.1));
      m.armL.rotation.z = mix(-0.25, -2.55 + Math.max(0, Math.sin(u * 16)) * 0.18, tap);
      m.head.rotation.y = -1.0 * seg(u, 1.95, 2.25);
      m.head.rotation.z = 0.08 * Math.sin(u * 16) * tap;
      eyes(m, u > 2.2 ? 0.5 : 1);
      camera.position.set(p.x + 0.45, 2.75, p.z + mix(5.9, 5.3, u / 2.7));
      camera.lookAt(p.x - 0.2, 2.55, p.z);
      return head();
    };
    break;
  }
  case 'C1': { // "30 segundos... 900 quadros... um por um" (1, 2, 3 no contador)
    const p = keyPos(1, 6); m.root.position.copy(p); m.root.rotation.y = Math.PI - 0.25;
    const scr = studio.screenPoint(800, 330);
    update = (u) => {
      pose(m, STAND, STAND, 0); star(m, 1); eyes(m, 1);
      const n = u < 5.55 ? 0 : u < 5.75 ? 1 : u < 5.95 ? 2 : 3;
      studio.redraw((g, w, h) => telaRender(g, w, h, { n }));
      const push = seg(u, 3.4, 4.4);
      const far = V(p.x + 1.8, 5.0, p.z + 12.5), near = scr.clone().addScaledVector(screenNormal, 15.0).add(V(0, -0.8, 0));
      camera.position.copy(far.lerp(near, push));
      camera.lookAt(V(p.x, 3.6, p.z).lerp(scr, 0.6 + 0.4 * push));
      return push > 0.5 ? scr : V(p.x, 3.0, p.z).lerp(scr, 0.6);
    };
    break;
  }
  case 'C2': { // "sem café": desaba; tenta alcançar a caneca e desiste
    const p = keyPos(3, 11); m.root.position.copy(p);
    const mug = V(10.5, 1.0, 3.5);
    m.root.rotation.y = Math.atan2(mug.x - p.x, mug.z - p.z) - Math.PI / 2;
    update = (u) => {
      sit(m, 1); star(m, 1 - 0.35 * seg(u, 0, 0.9));
      pose(m, STAND, STAND, 0); m.rulerPivot.visible = false;
      m.body.position.y -= 0.12 * seg(u, 0.1, 0.9);
      m.head.rotation.x = 0.25 * seg(u, 0.1, 0.9) * (1 - seg(u, 1.0, 1.3)) + 0.3 * seg(u, 2.8, 3.1);
      eyes(m, mix(1, 0.5, seg(u, 0.1, 0.9)) * blink(u, 2.4));
      const reach = seg(u, 1.25, 1.65) * (1 - seg(u, 2.65, 2.85));
      m.armR.rotation.z = -0.05 * reach + Math.sin(u * 40) * 0.04 * reach;
      m.armR.scale.x = 1 + 0.35 * reach;
      m.root.rotation.z = -0.12 * reach;
      m.head.rotation.y = 0.7 * seg(u, 1.1, 1.35) * (1 - seg(u, 2.7, 2.95)) - 0.5 * seg(u, 2.95, 3.2);
      const mid = p.clone().lerp(V(mug.x, 0.8, mug.z), 0.45);
      camera.position.set(mid.x, 3.0, mid.z + 14.0);
      camera.lookAt(mid.x, 1.3, mid.z);
      return mid;
    };
    break;
  }
  case 'B1': { // pedido "deixa mais profissional" → aponta para a estrela → estoura em "mais brilho"
    const p = keyPos(2, 5); m.root.position.copy(p);
    const BLAST = 5.8;
    update = (u) => {
      studio.redraw((g, w, h) => telaPedido(g, w, h, { typing: seg(u, 1.2, 3.4) }));
      pose(m, STAND, STAR, seg(u, 3.8, 4.3) * (1 - seg(u, 6.6, 7.1)));
      const k = clamp((u - 4.0) / (BLAST - 4.0));
      const blown = u >= BLAST && u < BLAST + 0.4;
      star(m, u < BLAST ? 1 + 28 * k * k * k : blown ? 30 : 1);
      m.starLight.intensity = u < BLAST ? 6 + 120 * k * k * k : blown ? 120 : 6;
      eyes(m, u < 4.0 ? blink(u, 2.0) : u < BLAST + 0.4 ? mix(1, 0.45, k) : u < 7.3 ? 0.22 : blink(u, 7.6));
      m.head.rotation.z = u > BLAST + 0.4 && u < 7.3 ? Math.sin(u * 30) * 0.03 : 0.04;
      m.head.rotation.x = u < 3.6 ? -0.12 * seg(u, 1.0, 1.4) : 0;
      if (u < BLAST + 0.4) {
        const d = mix(9.0, 6.6, seg(u, 4.0, BLAST));
        camera.position.set(p.x + 0.4, 2.6, p.z + d); camera.lookAt(p.x, 2.7, p.z);
      } else {
        camera.position.set(p.x - 0.9, 2.4, p.z + 5.6); camera.lookAt(p.x, 2.5, p.z);
      }
      return head();
    };
    break;
  }
  case 'S1A': { // "ver a sua ideia ganhando forma": por cima do ombro, os clipes se encaixam
    const p = keyPos(1, 6); m.root.position.copy(p); m.root.rotation.y = Math.PI + 0.35;
    const tl = studio.screenPoint(760, 760);
    update = (u) => {
      pose(m, STAND, POINT_FWD, seg(u, 1.3, 1.8));
      m.rulerPivot.rotation.z += Math.sin(u * 4) * 0.1 * seg(u, 1.8, 2.0);
      star(m, 1); eyes(m, 1);
      studio.redraw((g, w, h) => telaTimeline(g, w, h, { arrange: seg(u, 1.5, 3.6), ph: 560 + 120 * seg(u, 1.5, 3.9) }));
      const d = u / 3.9;
      camera.position.set(p.x + 3.0 - 0.4 * d, 5.6, p.z + 8.0 - 1.2 * d);
      camera.lookAt(V(p.x, 2.6, p.z).lerp(tl, 0.85));
      return tl;
    };
    break;
  }
  case 'S1B': { // sentado, régua no ombro; olha para a régua em "a régua é decorativa"; "não." com aceno de cabeça
    const p = keyPos(2, 5); m.root.position.set(p.x + 0.58, p.y, p.z);
    finaleLights(0.8);
    update = (u) => {
      sit(m, 1); pose(m, SHOULDER, SHOULDER, 1);
      star(m, 0.9 + 0.08 * Math.sin(u * 2));
      const look = seg(u, 0.2, 0.45) * (1 - seg(u, 1.5, 1.8));
      m.head.rotation.y = 0.6 * look; m.head.rotation.x = -0.15 * look;
      const nod = Math.sin(clamp((u - 3.36) / 0.35) * Math.PI) * 0.14;
      m.head.rotation.x += nod;
      m.head.rotation.z = 0.06 * (1 - look);
      eyes(m, u > 3.3 && u < 4.0 ? 0.5 : blink(u, 2.6));
      const k = smooth(u / 4.3);
      camera.position.set(0.3, mix(3.0, 2.8, k), mix(12.0, 9.6, k));
      camera.lookAt(0.3, mix(3.0, 2.7, k), -2);
      return m.root.position.clone().add(V(0, 1.3, 0));
    };
    break;
  }
  case 'W1': { // acena, perde o equilíbrio, faz pose como se fosse de propósito
    const p = keyPos(2, 5); m.root.position.set(p.x + 0.58, p.y, p.z);
    finaleLights(1);
    update = (u) => {
      sit(m, 1); pose(m, SHOULDER, SHOULDER, 1);
      const wave = seg(u, 0.15, 0.4) * (1 - seg(u, 1.15, 1.3));
      const tip = seg(u, 1.3, 1.75) * (1 - seg(u, 1.85, 2.1));
      const over = Math.sin(clamp((u - 2.1) / 0.3) * Math.PI) * 0.06;
      m.armL.rotation.z = mix(-0.25, -1.65 + Math.sin(u * 12) * 0.35, wave) + mix(0, -1.0, tip);
      m.root.rotation.z = 0.42 * tip - over;
      m.armL.rotation.z += mix(0, -1.7, seg(u, 2.3, 2.55));
      star(m, 1 + 0.6 * seg(u, 2.35, 2.5) - 0.4 * seg(u, 2.6, 3.2));
      eyes(m, u > 1.3 && u < 2.1 ? 1.15 : blink(u, 3.3));
      m.head.rotation.z = -0.15 * tip;
      camera.position.set(0.3, 3.2, mix(12.4, 13.0, u / 4));
      camera.lookAt(0.3, 3.9, -2);
      return m.root.position.clone().add(V(0, 1.3, 0));
    };
    break;
  }
}

const f0 = update(0);
const { composer, bokeh } = studio.makeComposer(camera, f0, { aperture: 0.0016, maxblur: 0.009, samples: 0 });
window.frame = (u) => { const f = update(u); bokeh.uniforms['focus'].value = camera.position.distanceTo(f); composer.render(); };
window.frame(0);
window.__ready = true;
</script>
</body>
</html>
