<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f6e3d4; }
  canvas { display: block; }
  #label {
    position: absolute; left: 0; right: 0; bottom: 34px; text-align: center;
    font-family: "DejaVu Sans", Arial, sans-serif; font-weight: bold; font-size: 40px;
    color: #7a3b26; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(255,255,255,0.6);
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="label">Claudinho, o editor</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1024, H = 1024;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Fundo em degradê
{
  const c = document.createElement('canvas'); c.width = 16; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#ffd9c2');
  grd.addColorStop(0.55, '#fbeee3');
  grd.addColorStop(1, '#e9d3f0');
  g.fillStyle = grd; g.fillRect(0, 0, 16, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(33, W / H, 0.1, 100);
camera.position.set(0.1, 2.0, 8.6);
camera.lookAt(0.1, 1.5, 0);

// Luzes
scene.add(new THREE.HemisphereLight(0xfff1e6, 0xc9a3b8, 0.9));
const key = new THREE.DirectionalLight(0xfff0e0, 2.6);
key.position.set(3.5, 6, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -2;
key.shadow.radius = 6; key.shadow.bias = -0.0003; key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffb48a, 2.2);
rim.position.set(-4, 3, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xb9a6ff, 1.2);
rim2.position.set(4, 2, -3); scene.add(rim2);

// Materiais
const skin = new THREE.MeshPhysicalMaterial({
  color: 0xe2754c, roughness: 0.42, clearcoat: 0.55, clearcoatRoughness: 0.35,
  sheen: 0.6, sheenColor: new THREE.Color(0xffc2a0), sheenRoughness: 0.5
});
const skinDark = skin.clone(); skinDark.color.set(0xc95c38);
const white = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05 });
const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x1d120d, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.02 });
const irisMat = new THREE.MeshPhysicalMaterial({ color: 0x5a3220, roughness: 0.2, clearcoat: 1 });
const shine = new THREE.MeshBasicMaterial({ color: 0xffffff });
const browMat = new THREE.MeshStandardMaterial({ color: 0x6b2f1c, roughness: 0.6 });
const cheekMat = new THREE.MeshStandardMaterial({ color: 0xff7f93, roughness: 0.7, transparent: true, opacity: 0.55 });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x5a1a12, roughness: 0.5 });
const tongueMat = new THREE.MeshPhysicalMaterial({ color: 0xff6f7d, roughness: 0.35, clearcoat: 0.6 });
const gold = new THREE.MeshPhysicalMaterial({ color: 0xffc94a, metalness: 0.85, roughness: 0.22, emissive: 0xffa400, emissiveIntensity: 0.35, clearcoat: 1 });
const charcoal = new THREE.MeshPhysicalMaterial({ color: 0x24242c, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.2 });
const cushion = new THREE.MeshStandardMaterial({ color: 0x3a3a44, roughness: 0.9 });
const stripeW = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.4 });
const chalk = new THREE.MeshStandardMaterial({ color: 0xd9d9e0, roughness: 0.8 });

const shadowAll = (o) => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

// Corpo (elipsoide)
const BA = 1.0, BB = 1.12, BC = 0.95, BY = 1.32;
const body = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), skin);
body.scale.set(BA, BB, BC); body.position.y = BY;
scene.add(body);

const surfZ = (x, y) => BC * Math.sqrt(Math.max(0, 1 - (x / BA) ** 2 - ((y - BY) / BB) ** 2));
const normalAt = (x, y, z) => new THREE.Vector3(x / BA ** 2, (y - BY) / BB ** 2, z / BC ** 2).normalize();
function placeOnSurface(mesh, x, y, lift = 0) {
  const z = surfZ(x, y);
  const n = normalAt(x, y, z);
  mesh.position.set(x, y, z).addScaledVector(n, lift);
  mesh.lookAt(mesh.position.clone().add(n));
  return mesh;
}

// Olhos
function eye(x) {
  const y = 1.47;
  const g = new THREE.Group();
  placeOnSurface(g, x, y, -0.04);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.21, 64, 64), white);
  ball.scale.set(1, 1.18, 0.62); g.add(ball);
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.135, 48, 48), irisMat);
  iris.scale.set(1, 1.15, 0.45); iris.position.set(-x * 0.06, -0.03, 0.095); g.add(iris);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.095, 48, 48), pupilMat);
  pupil.scale.set(1, 1.15, 0.45); pupil.position.set(-x * 0.06, -0.03, 0.115); g.add(pupil);
  const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.038, 16, 16), shine);
  s1.position.set(-x * 0.06 + 0.045, 0.035, 0.165); g.add(s1);
  const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.017, 16, 16), shine);
  s2.position.set(-x * 0.06 - 0.04, -0.08, 0.16); g.add(s2);
  scene.add(g);
}
eye(-0.34); eye(0.34);

// Sobrancelhas
function brow(sign) {
  const pts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const x = sign * (0.17 + t * 0.33);
    const y = 1.79 + Math.sin(t * Math.PI) * 0.05 - t * 0.02;
    pts.push(new THREE.Vector3(x, y, surfZ(x, y) + 0.015));
  }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 32, 0.03, 12), browMat);
  scene.add(m);
}
brow(-1); brow(1);

// Bochechas
for (const s of [-1, 1]) {
  const c = placeOnSurface(new THREE.Mesh(new THREE.SphereGeometry(0.14, 32, 32), cheekMat), s * 0.6, 1.2, -0.02);
  c.scale.set(1, 0.62, 0.15);
  scene.add(c);
}

// Boca (sorriso aberto)
{
  const shape = new THREE.Shape();
  const w = 0.2;
  shape.moveTo(-w, 0);
  shape.quadraticCurveTo(0, -0.04, w, 0);
  shape.quadraticCurveTo(0.17, -0.2, 0, -0.22);
  shape.quadraticCurveTo(-0.17, -0.2, -w, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 6, curveSegments: 32 });
  const mouth = new THREE.Group();
  placeOnSurface(mouth, 0, 1.17, -0.035);
  mouth.add(new THREE.Mesh(geo, mouthMat));
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.09, 32, 32), tongueMat);
  tongue.scale.set(1.2, 0.6, 0.4); tongue.position.set(0, -0.16, 0.06);
  mouth.add(tongue);
  scene.add(mouth);
}

// Antena com estrela
{
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 2.36, 0), new THREE.Vector3(0.04, 2.65, 0.02), new THREE.Vector3(0.2, 2.92, 0.05)
  ]);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.035, 12), skinDark));
  const star = new THREE.Shape();
  const R = 0.26, r = 0.08;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + Math.PI / 2;
    const rad = i % 2 === 0 ? R : r;
    const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    i === 0 ? star.moveTo(x, y) : star.lineTo(x, y);
  }
  const sg = new THREE.ExtrudeGeometry(star, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03, bevelSegments: 8 });
  sg.center();
  const s = new THREE.Mesh(sg, gold);
  s.position.set(0.23, 3.1, 0.06); s.rotation.set(0.1, -0.25, 0.12);
  scene.add(s);
  const glow = new THREE.PointLight(0xffc060, 2.5, 3, 2);
  glow.position.set(0.23, 3.1, 0.5); scene.add(glow);
}

// Fones de ouvido
{
  const hp = new THREE.Group();
  const band = new THREE.Mesh(new THREE.TorusGeometry(1.08, 0.065, 24, 96, Math.PI), charcoal);
  band.scale.set(1, 1.0, 1); hp.add(band);
  const pad = new THREE.Mesh(new THREE.TorusGeometry(1.08, 0.05, 16, 64, Math.PI * 0.4), cushion);
  pad.rotation.z = Math.PI * 0.3; pad.position.y = -0.03; hp.add(pad);
  for (const s of [-1, 1]) {
    const cup = new THREE.Group();
    const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.27, 0.2, 48), charcoal);
    shell.rotation.z = Math.PI / 2; cup.add(shell);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.03, 16, 48), gold);
    ring.rotation.y = Math.PI / 2; ring.position.x = s * 0.105; cup.add(ring);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.02, 48), skin);
    cap.rotation.z = Math.PI / 2; cap.position.x = s * 0.105; cup.add(cap);
    const cush = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.07, 16, 48), cushion);
    cush.rotation.y = Math.PI / 2; cush.position.x = -s * 0.1; cup.add(cush);
    cup.position.set(s * 1.07, 0, 0);
    hp.add(cup);
  }
  hp.position.set(0, 1.45, -0.05);
  hp.rotation.x = -0.12;
  scene.add(hp);
}

// Braços
function arm(points, handPos) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p))), 48, 0.11, 20), skin));
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.17, 48, 48), skin);
  hand.position.set(...handPos); hand.scale.set(1, 1.05, 0.9); g.add(hand);
  scene.add(g);
  return hand;
}
// esquerdo (acenando)
const lh = arm([[-0.85, 1.05, 0.25], [-1.32, 1.2, 0.35], [-1.55, 1.65, 0.4], [-1.55, 2.05, 0.42]], [-1.55, 2.13, 0.42]);
// dedinhos levantados
for (let i = 0; i < 3; i++) {
  const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.1, 8, 16), skin);
  f.position.set(-1.62 + i * 0.07, 2.3, 0.44); f.rotation.z = 0.25 - i * 0.2;
  scene.add(f);
}
// direito (segurando a claquete)
arm([[0.85, 1.0, 0.3], [1.2, 0.92, 0.5], [1.42, 1.02, 0.62]], [1.48, 1.08, 0.66]);

// Claquete
{
  const cl = new THREE.Group();
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.58, 0.06), charcoal);
  board.position.set(0.42, -0.29, 0); cl.add(board);
  for (const [w, y] of [[0.68, -0.2], [0.42, -0.34], [0.56, -0.48]]) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(w, 0.025, 0.01), chalk);
    l.position.set(0.08 + w / 2, y, 0.035); cl.add(l);
  }
  // barra fixa listrada
  const fixed = new THREE.Group();
  const fb = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.12, 0.065), charcoal);
  fb.position.set(0.425, 0.06, 0); fixed.add(fb);
  // barra que abre
  const top = new THREE.Group();
  const tb = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.12, 0.065), charcoal);
  tb.position.set(0.425, 0.06, 0); top.add(tb);
  for (let i = 0; i < 4; i++) {
    for (const [grp, flip] of [[fixed, 1], [top, -1]]) {
      const x0 = 0.06 + i * 0.2, sh = new THREE.Shape();
      sh.moveTo(x0, 0.005); sh.lineTo(x0 + 0.09, 0.005);
      sh.lineTo(x0 + 0.09 + flip * 0.06, 0.115); sh.lineTo(x0 + flip * 0.06, 0.115);
      const st = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.006, bevelEnabled: false }), stripeW);
      st.position.z = 0.033; grp.add(st);
    }
  }
  fixed.position.y = 0; cl.add(fixed);
  top.position.y = 0.12; top.rotation.z = 0.42; cl.add(top);
  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.09, 16), gold);
  hinge.rotation.x = Math.PI / 2; hinge.position.set(0, 0.12, 0); cl.add(hinge);
  cl.position.set(1.3, 1.5, 0.55);
  cl.rotation.set(0.05, -0.45, -0.08);
  scene.add(cl);
}
// polegar por cima da claquete
{
  const th = new THREE.Mesh(new THREE.CapsuleGeometry(0.055, 0.1, 8, 16), skin);
  th.position.set(1.42, 1.17, 0.78); th.rotation.z = 0.5;
  scene.add(th);
}

// Pés
for (const s of [-1, 1]) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 48), skinDark);
  f.scale.set(0.3, 0.15, 0.4); f.position.set(s * 0.42, 0.14, 0.2);
  scene.add(f);
}

// Pedestal
{
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 1.85, 0.18, 96),
    new THREE.MeshPhysicalMaterial({ color: 0xfff4ea, roughness: 0.35, clearcoat: 0.4 }));
  ped.position.y = -0.09; scene.add(ped);
  const trim = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.025, 12, 128), gold);
  trim.rotation.x = Math.PI / 2; trim.position.y = -0.09; scene.add(trim);
}

// Elementos flutuantes
function miniStar(x, y, z, s, mat) {
  const sh = new THREE.Shape();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + Math.PI / 2, rad = i % 2 === 0 ? 1 : 0.32;
    i === 0 ? sh.moveTo(Math.cos(a) * rad, Math.sin(a) * rad) : sh.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.1, bevelSegments: 4 });
  g.center();
  const m = new THREE.Mesh(g, mat); m.scale.setScalar(s); m.position.set(x, y, z); m.rotation.set(0.2, 0.4, 0.3);
  scene.add(m);
}
miniStar(1.75, 2.9, -0.6, 0.12, gold);
miniStar(-2.0, 0.9, -0.4, 0.09, gold);
miniStar(2.1, 0.5, -0.8, 0.07, gold);
for (const [x, y, z, r, c] of [[-1.9, 2.95, -1, 0.09, 0xe2754c], [2.25, 1.9, -1.2, 0.07, 0xb9a6ff], [-2.3, 1.7, -1.5, 0.06, 0xb9a6ff], [1.0, 3.3, -1.5, 0.05, 0xe2754c]]) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 32), new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.2, clearcoat: 1 }));
  b.position.set(x, y, z); scene.add(b);
}
// Rolo de filme
{
  const reel = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.06, 64), charcoal);
  disc.rotation.x = Math.PI / 2; reel.add(disc);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.035, 16, 64), gold); reel.add(rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.1, 32), gold);
  hub.rotation.x = Math.PI / 2; reel.add(hub);
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.07, 32), new THREE.MeshStandardMaterial({ color: 0xf6dccb }));
    hole.rotation.x = Math.PI / 2; hole.position.set(Math.cos(a) * 0.24, Math.sin(a) * 0.24, 0.001);
    reel.add(hole);
  }
  reel.position.set(-1.95, 2.75, -0.9); reel.rotation.set(0.15, 0.5, 0.2);
  scene.add(reel);
}

shadowAll(scene);

renderer.render(scene, camera);
requestAnimationFrame(() => { renderer.render(scene, camera); window.__done = true; });
</script>
</body>
</html>
