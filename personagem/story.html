<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: Montserrat, 'Noto Color Emoji', sans-serif; }
  canvas { display: block; position: absolute; inset: 0; }
  .bubble { position: absolute; left: 90px; right: 90px; top: 250px; min-height: 150px; padding: 34px 40px; box-sizing: border-box;
    background: #fff8ea; border-radius: 44px; color: #1d1530; font-weight: 900; font-size: 64px; line-height: 1.15; text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45); transform-origin: 50% 120%; opacity: 0; display: flex; align-items: center; justify-content: center; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -34px; margin-left: -30px; border: 30px solid transparent; border-top: 36px solid #fff8ea; border-bottom: 0; }
  .bubble b { color: #d9773f; }
  #arrow { position: absolute; left: 0; right: 0; top: 1395px; text-align: center; font-size: 150px; opacity: 0; }
  #hint { position: absolute; left: 0; right: 0; top: 1335px; text-align: center; color: #f2c14e; font-weight: 900; font-size: 46px; letter-spacing: 2px; opacity: 0;
    text-shadow: 0 4px 18px rgba(0,0,0,0.6); }
  #fade { position: absolute; inset: 0; background: #000; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div class="bubble" id="b0"><span>Oi! Eu sou o Davi 👋</span></div>
<div class="bubble" id="b1"><span>Quer mais conversas minhas com <b>Deus</b>? 🙏</span></div>
<div class="bubble" id="b2"><span>Que horário você quer que eu poste? ⏰</span></div>
<div class="bubble" id="b3"><span>Vota na enquete aqui embaixo! 👇</span></div>
<div id="hint">VOTE AQUI</div>
<div id="arrow">👇</div>
<div id="fade"></div>
<script type="module">
// Story de enquete: Davi acena, pergunta o melhor horário e aponta para a enquete (o adesivo é colocado no app, na área livre embaixo).
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createDavi, setFace } from './davi.js';

const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => smooth((t - a) / (b - a));
const backOut = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
// fundo do perfil: azul-noite, brilho dourado atrás do Davi, partículas de luz
const bg = document.createElement('canvas'); bg.width = 1080; bg.height = 1920;
const g = bg.getContext('2d');
g.fillStyle = '#0d1430'; g.fillRect(0, 0, 1080, 1920);
let gr = g.createRadialGradient(540, 760, 30, 540, 760, 900);
gr.addColorStop(0, 'rgba(255,214,140,0.9)'); gr.addColorStop(0.22, 'rgba(242,170,80,0.5)'); gr.addColorStop(0.6, 'rgba(80,60,110,0.22)'); gr.addColorStop(1, 'rgba(13,20,48,0)');
g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920);
let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
for (let i = 0; i < 120; i++) { const x = rnd() * 1080, y = rnd() * 1920, r = 1 + rnd() * 3.5; g.fillStyle = `rgba(255,230,170,${0.15 + rnd() * 0.5})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
const bgT = new THREE.CanvasTexture(bg); bgT.colorSpace = THREE.SRGBColorSpace; scene.background = bgT;

// chão: disco de luz suave onde o Davi pisa
const discC = document.createElement('canvas'); discC.width = discC.height = 256;
const dg = discC.getContext('2d'); const rg = dg.createRadialGradient(128, 128, 0, 128, 128, 128);
rg.addColorStop(0, 'rgba(255,210,140,0.55)'); rg.addColorStop(1, 'rgba(255,210,140,0)'); dg.fillStyle = rg; dg.fillRect(0, 0, 256, 256);
const disc = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(discC), transparent: true, depthWrite: false }));
disc.rotation.x = -Math.PI / 2; disc.position.y = 0.01; scene.add(disc);
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.35 }));
shadowFloor.rotation.x = -Math.PI / 2; shadowFloor.receiveShadow = true; scene.add(shadowFloor);

const d = createDavi(); scene.add(d.root);
const lips = d.mouth.children[1];
const smile = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.022, 10, 28, Math.PI * 0.7), new THREE.MeshStandardMaterial({ color: 0x5a2a20, roughness: 0.6 }));
smile.rotation.z = Math.PI + Math.PI * 0.15; smile.position.set(0, 0.04, 0.01); d.mouth.add(smile);
d.root.traverse(o => { if (o.isMesh) { o.castShadow = true; } });

scene.add(new THREE.HemisphereLight(0x8fa0d8, 0x1a1420, 0.35));
const key = new THREE.SpotLight(0xffc98a, 40, 25, 0.6, 0.7, 1.4);
key.position.set(-3, 6, 4); key.target.position.set(0, 1.4, 0); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); scene.add(key, key.target);
const fill = new THREE.PointLight(0x7f95ff, 8, 12, 2); fill.position.set(3, 2.5, 3); scene.add(fill);
const rim = new THREE.PointLight(0xffd59a, 12, 8, 2); rim.position.set(-1.2, 3.6, -1.8); scene.add(rim);
const face = new THREE.PointLight(0xffe2c8, 1.5, 5, 2); face.position.set(0, 2.6, 2.4); scene.add(face);

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.3, 0.5, 0.97));
composer.addPass(new OutputPass());

// falas: [início, fim]; a boca mexe enquanto o balão "digita"
const SAY = [[0.5, 2.6], [3.2, 5.9], [6.5, 9.4], [9.9, 12.4]];
const DUR = 13.5;
const bubbles = [0, 1, 2, 3].map(i => document.getElementById('b' + i));
const ENV = (await (await fetch('davi_video/env_story.json')).json()).v;
const envAt = (t) => { const f = t * 24, i = Math.floor(f), k = f - i; return (ENV[i] || 0) * (1 - k) + (ENV[i + 1] || 0) * k; };

window.frame = (t) => {
  // corpo: respira, balança de leve, pulinho de alegria no começo
  const breath = Math.sin(t * 2.4) * 0.015;
  const hop = Math.max(0, Math.sin(clamp((t - 0.2) / 0.5) * Math.PI)) * 0.25;
  d.root.position.y = hop; d.body.scale.y = 1 + breath;
  d.root.rotation.y = Math.sin(t * 0.9) * 0.08 - 0.08;
  d.body.rotation.z = Math.sin(t * 1.3) * 0.02;

  // braço direito: aceno (0.3–2.6), mão no queixo pensando (6.5–9.4), aponta para baixo/frente (9.9–)
  const R = d.arms.R, L = d.arms.L;
  const wave = seg(t, 0.3, 0.7) * (1 - seg(t, 2.4, 2.9));
  const think = seg(t, 6.4, 6.9) * (1 - seg(t, 9.3, 9.8));
  const point = seg(t, 9.8, 10.3);
  R.sh.rotation.z = 0.08 + wave * 2.55 + think * 0.25 + point * 0.75;
  R.sh.rotation.x = -think * 1.75 - point * 0.7;
  R.elbow.rotation.z = wave * Math.sin(t * 11) * 0.45;
  R.elbow.rotation.x = -think * 1.6 - point * 0.2;
  // braço esquerdo: abre na pergunta "quer mais conversas?"
  const open = seg(t, 3.1, 3.5) * (1 - seg(t, 5.8, 6.3));
  L.sh.rotation.z = -0.08 - open * 0.7; L.sh.rotation.x = -open * 0.5;

  // cabeça e expressão
  const look = point > 0 ? [0, -0.9 * point] : [Math.sin(t * 0.7) * 0.15, 0.05 + think * 0.5];
  d.head.rotation.x = -0.05 + point * 0.28 - think * 0.15 + Math.sin(t * 1.7) * 0.02;
  d.head.rotation.z = think * 0.12 + Math.sin(t * 1.1) * 0.03;
  d.head.rotation.y = think * -0.2;
  // boca segue o volume da voz gravada; sorri quando está em silêncio
  const v = Math.max(envAt(t), envAt(t - 0.04) * 0.8, envAt(t + 0.04) * 0.8);
  const sp = v > 0.06 || Math.max(...[0.1, 0.2, 0.3].map(dt => Math.max(envAt(t - dt), envAt(t + dt)))) > 0.06;
  const talk = clamp(v * 0.85);
  const blink = (t % 3.1) < 0.1 ? 0.1 : 1;
  setFace(d, { open: blink, talk, browUp: 0.55 + think * 0.3, look });
  d.inner.visible = lips.visible = !!sp; smile.visible = !sp;

  // câmera: aproxima um pouco no começo
  const z = 15.6 - 1.3 * smooth(t / 3) - 0.4 * seg(t, 9.8, 11);
  camera.position.set(0.3, 1.8, z); camera.lookAt(0, 1.62, 0);
  composer.render();

  // camadas de texto
  bubbles.forEach((b, i) => {
    const [a, e] = SAY[i];
    const s = backOut((t - a + 0.1) / 0.35), out = i === 3 ? 1 : 1 - seg(t, e + 0.3, e + 0.55);
    b.style.opacity = clamp((t - a + 0.1) / 0.15) * out;
    b.style.transform = `scale(${0.6 + 0.4 * s})`;
  });
  const ar = document.getElementById('arrow'), hi = document.getElementById('hint');
  const ka = seg(t, 10.3, 10.7);
  ar.style.opacity = ka; hi.style.opacity = ka;
  ar.style.transform = `translateY(${Math.abs(Math.sin(t * 5)) * 40}px)`;
  document.getElementById('fade').style.opacity = 1 - clamp(t / 0.5);
};
window.DUR = DUR;
document.fonts.load('900 64px Montserrat').then(() => { window.frame(0); window.__ready = true; });
</script>
</body>
</html>
