    const TXT = 'Eu tô aprendendo'; let lastN = -1;
    update = (T) => {
      const e = expr(T), u = (T - T0) / (T1 - T0);
      q.setGod(mix(0.7, 1.3, seg(T, 106, 110))); q.lamp.intensity = 6;
