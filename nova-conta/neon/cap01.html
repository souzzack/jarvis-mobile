const degrauY = i => i < 0 ? 0 : i >= 14 ? 4.33 : 0.25 + 0.3 * i;
function escada(p, s, t) {
  aPe(p, 120, 0, Math.PI, { walk: 0.6, ph: s * Math.PI }, t);
  const pes = [0, 1].map(j => { const u = (s - j) / 2 + 0.5, n = Math.floor(u), f = u - n, sw = sm(clamp((f - 0.5) * 2));
    const a = 2 * n + j - 1, idx = a + 2 * sw, base = mix(degrauY(Math.min(a, 14)), degrauY(Math.min(a + 2, 14)), sw);
    return { z: -0.5 * Math.min(idx, 14.6) + 0.2, y: base + 0.3 * Math.sin(Math.PI * sw), base }; });
  const rootY = Math.min(pes[0].base, pes[1].base) + 0.02, rootZ = -0.5 * s + 0.05;
  p.root.position.set(120, rootY, rootZ); p.body.position.y = 0; p.body.rotation.x = 0.12;
  const L1 = 0.78, L2 = 0.84;
  p.legs.forEach(({ hip, knee }, j) => {
    const Tz = -(pes[j].z - rootZ), Ty = pes[j].y - (rootY + p.H);
    const dd = Math.min(Math.hypot(Tz, Ty), L1 + L2 - 0.002);
    const b = Math.acos(clamp((dd * dd - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1));
    hip.rotation.set(Math.atan2(-Tz, -Ty) - Math.atan2(L2 * Math.sin(b), L1 + L2 * Math.cos(b)) - 0.12, 0, 0); knee.rotation.x = b;
  });
}

  return { c: cel.position.clone(), h };
}
