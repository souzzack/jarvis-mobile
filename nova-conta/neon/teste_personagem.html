</head><body><script type="module">
// Folha dos personagens novos: Kai e Luna, corpo inteiro + close do rosto, sob luz neon.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createPessoa, pose } from './pessoa.js';
const W = 1600, H = 1000;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x07060f);
const chao = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x0c0b16, roughness: 0.3, metalness: 0.3 })); chao.rotation.x = -Math.PI / 2; chao.receiveShadow = true; s.add(chao);
s.add(new THREE.HemisphereLight(0x3a3060, 0x05040a, 0.6));
const key = new THREE.DirectionalLight(0xffe6d0, 1.3); key.position.set(2, 5, 6); key.castShadow = true; s.add(key);
const rosa = new THREE.PointLight(0xff3fb4, 40, 12, 1.5); rosa.position.set(3, 3.5, -2); s.add(rosa);
const ciano = new THREE.PointLight(0x3ae0ff, 40, 12, 1.5); ciano.position.set(-3, 3, -1.5); s.add(ciano);
const k = createPessoa('kai'); k.root.position.x = -0.9; k.root.rotation.y = 0.35; pose(k, { cabeca: [0.1, 0], franze: 0.3 }); s.add(k.root);

const comp = new EffectComposer(r); comp.addPass(new RenderPass(s, c)); comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.5, 0.4, 0.85)); comp.addPass(new OutputPass());
comp.render();
// close do Kai no canto
const c2 = new THREE.PerspectiveCamera(22, 1, 0.05, 100); const hp = k.head.getWorldPosition(new THREE.Vector3()); c2.position.copy(hp).add(new THREE.Vector3(0.6, 0.05, 1.9)); c2.lookAt(hp);
r.autoClear = false; r.setViewport(W - 380, 20, 360, 360); r.setScissor(W - 380, 20, 360, 360); r.setScissorTest(true); r.clear(); r.render(s, c2);
const c3 = c2.clone(); const lp = l.head.getWorldPosition(new THREE.Vector3()); c3.position.copy(lp).add(new THREE.Vector3(-0.6, 0.05, 1.9)); c3.lookAt(lp);
r.setViewport(20, 20, 360, 360); r.setScissor(20, 20, 360, 360); r.clear(); r.render(s, c3);
